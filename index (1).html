<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>예준이의 말랑 들판 원정대</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>:root{--sky:#bfe6ff;--ink:#3a2f4a;--cream:#fffaf0;--panel:rgba(255,250,240,.95);--berry:#ff6f91;--leaf:#5fbf5a;--gold:#ffc94d;--shade:rgba(58,47,74,.22);--mute:#7a6f88;--sky2:#7fd0ff;--grape:#9a6ad8;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:grab}
#game:active{cursor:grabbing}
button{font-family:var(--font);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:var(--ink);cursor:pointer;touch-action:none;background:var(--cream)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--shade)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
.hud-top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:8px 12px 8px 8px;width:min(300px,44vw);align-items:center}
.ava{grid-row:1/4;width:52px;height:52px;border-radius:14px;background:#ffe3ea;border:3px solid var(--ink);overflow:hidden;position:relative}
.ava canvas{position:absolute;left:-6px;top:-4px;width:64px;height:84px}
.ava b{position:absolute;left:0;right:0;bottom:0;background:var(--ink);color:#fff;font-weight:400;font-size:11px;text-align:center;line-height:15px}
.bar{position:relative;height:14px;border:2.5px solid var(--ink);border-radius:9px;background:#ffe3ea;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--berry);transition:width .15s}
.bar span{position:absolute;inset:0;font-size:10.5px;line-height:10px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}
.bar.hg{height:9px;background:#fff1d6}.bar.hg i{background:#ffb84d}
.mini2{display:flex;gap:6px;align-items:center}.mini2 .bar{flex:1}
.bar.st{height:7px;background:#fffbe0}.bar.st i{background:#ffe066}.bar.xp{height:7px;background:#efe6ff}.bar.xp i{background:var(--grape)}
.res{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-width:min(320px,48vw)}
.chip{background:var(--panel);border:2.5px solid var(--ink);border-radius:999px;padding:1px 9px 1px 4px;font-size:13px;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .chip{box-shadow:0 3px 0 var(--shade)}
.chip i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block;flex:none}
.chip.pop{animation:pop .35s ease}.chip.lack{background:#ffe3ea}.chip.dim{opacity:.55}.chip.sel{background:#fff1a8}
.chip[data-act]{cursor:pointer;pointer-events:auto}
@keyframes pop{40%{transform:scale(1.18)}}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:118px;height:118px;border:3px solid var(--ink);border-radius:16px;background:var(--cream);box-shadow:0 4px 0 var(--shade)}
.clock{font-size:13px;padding:2px 10px;border-radius:999px}
.wn{font-size:12.5px;padding:2px 10px;border-radius:999px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.netst{margin:0;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tc{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(560px,calc(100vw - 680px));min-width:280px}
.obj{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:14.5px;line-height:1.3;max-width:100%}
.obj #oarr{flex:none;width:24px;height:24px;border-radius:50%;background:var(--berry);color:#fff;font-size:13px;line-height:24px;text-align:center;border:2px solid var(--ink)}
.obj #odist{flex:none;font-size:12px;color:var(--mute)}
#pips{display:flex;gap:5px}#pips i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--ink);background:var(--cream);box-shadow:0 2px 0 var(--shade)}#pips i.on{background:var(--leaf)}#pips i.cur{background:var(--berry);animation:pop 1s infinite}
#banner{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 168px);transform:translateX(-50%);padding:5px 14px;font-size:14px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;border-radius:999px;display:flex;align-items:center;gap:6px}
#banner i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none}
#bossbar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 250px);transform:translateX(-50%);width:min(380px,calc(100% - 32px));display:grid;gap:4px;padding:6px 12px}
#bossbar .t{font-size:14px;display:flex;justify-content:space-between;gap:8px}#bossbar .bar{height:16px}#bossbar .bar i{background:#ff9a3c}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.9);background:var(--ink);color:var(--cream);border-radius:20px;padding:12px 22px;font-size:22px;line-height:1.35;text-align:center;max-width:calc(100% - 48px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:6;box-shadow:0 6px 0 rgba(0,0,0,.2)}
#toast small{display:block;font-size:14px;opacity:.85;margin-top:2px}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toasts{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:5px;width:min(460px,calc(100vw - 32px))}
.stoast{background:var(--panel);border:2.5px solid var(--ink);border-radius:14px;padding:4px 12px;font-size:14px;box-shadow:0 3px 0 var(--shade);animation:tin .2s ease-out;transition:opacity .4s}
.stoast.bad{background:#ffe3ea}.stoast.sat{background:#e4fbef}.stoast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;box-shadow:inset 0 0 90px 10px rgba(255,70,100,.6)}
#hurt.on{animation:hf .4s ease-out}@keyframes hf{from{opacity:1}to{opacity:0}}
#prompt{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 206px);transform:translateX(-50%);padding:5px 14px;font-size:15px;border-radius:14px;white-space:nowrap}
kbd{display:inline-block;min-width:22px;padding:0 6px;border-radius:7px;background:var(--ink);color:#fff;font-family:var(--font);font-size:13px;text-align:center}
#stick{position:absolute;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:124px;height:124px;border-radius:50%;background:rgba(255,250,240,.5);border:3px solid var(--ink);touch-action:none;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 var(--shade);pointer-events:none}
.btns{position:absolute;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;pointer-events:auto}
#bA{grid-column:3;grid-row:1/3;width:100px;height:100px;border-radius:50%;background:var(--berry);color:#fff;font-size:22px}
#bR{grid-column:2;grid-row:2;width:64px;height:64px;border-radius:50%;background:var(--sky2);font-size:15px}
#bQ{grid-column:2;grid-row:1;width:64px;height:44px;border-radius:16px;background:var(--gold);font-size:15px}
#bF{grid-column:1;grid-row:2;width:56px;height:56px;border-radius:50%;background:#ffd6a0;font-size:14px;position:relative}
#bF::after{content:attr(data-n);position:absolute;right:-6px;top:-8px;background:var(--ink);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;min-width:18px}
#bE{grid-column:1;grid-row:1;width:56px;height:44px;border-radius:16px;font-size:16px;opacity:.55}
#bE.ready{opacity:1;background:#c8f5d0;animation:pop 1s infinite}
.rot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 162px);display:flex;gap:8px;pointer-events:auto;left:max(26px,calc(env(safe-area-inset-left,0px) + 26px))}
.rot button{width:44px;height:40px;border-radius:14px;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.dock{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;padding:6px 8px;border-radius:22px}
.dock button{width:60px;height:56px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;line-height:1;box-shadow:0 4px 0 var(--ink);padding:0}
.dock button small{font-size:11px;margin-top:3px}
.keys{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 148px);font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:right;line-height:1.7}
.keys b{background:rgba(58,47,74,.65);border-radius:6px;padding:0 5px;font-weight:400}
#mbars{position:fixed;inset:0;pointer-events:none;z-index:4}
.mbar{position:absolute;left:0;top:0;width:64px;margin-left:-32px;margin-top:-26px;display:flex;flex-direction:column;align-items:center;gap:1px}
.mbar b{font-weight:400;font-size:11px;color:#fff;background:var(--ink);border-radius:999px;padding:0 6px;line-height:15px}
.mbar span{display:block;width:100%;height:7px;border:2px solid var(--ink);border-radius:5px;background:#ffe3ea;overflow:hidden}.mbar span i{display:block;height:100%;background:var(--berry)}
.mbar.boss{width:90px;margin-left:-45px}.mbar.boss b{background:#ff4a6a}
#labels{position:fixed;inset:0;pointer-events:none;z-index:4}
.plabel{position:absolute;left:0;top:0;font-size:12.5px;color:#fff;background:rgba(40,140,160,.9);border:2px solid var(--ink);border-radius:999px;padding:0 8px;white-space:nowrap}
#fade{position:fixed;inset:0;background:#1a1430;opacity:0;pointer-events:none;transition:opacity .8s;z-index:9}#fade.on{opacity:1}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(58,47,74,.45);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));z-index:10;touch-action:auto}
.sheet{background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 7px 0 var(--ink);width:100%;max-width:520px;max-height:100%;overflow:auto;padding:18px;touch-action:pan-y;user-select:text}
.sheet.xl{max-width:820px}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheet h2{margin:0;font-weight:400;font-size:26px}.shead p{margin:2px 0 0;color:var(--mute);font-size:14px;line-height:1.45}
.sheet h3{margin:0;font-weight:400;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sheet h3 small{color:var(--mute);font-size:12.5px}
.x{width:44px;height:44px;border-radius:50%;font-size:18px;flex:none;box-shadow:0 4px 0 var(--ink)}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:8px 4px;border-radius:14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}
.tabs button.on{background:var(--ink);color:var(--cream)}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:2px dashed rgba(58,47,74,.2)}
.item .num{width:40px;height:40px;border-radius:12px;border:3px solid var(--ink);background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:15px}
.item h3 em{font-style:normal;font-size:12px;background:var(--ink);color:var(--cream);border-radius:999px;padding:1px 8px}.item h3 em.ok{background:var(--leaf)}
.item small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
.item .cost,.cost{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.item>button{padding:8px 14px;border-radius:14px;background:var(--gold);font-size:16px}
.item>button.sec,.sec{background:var(--sky2)}.item>button.eqb{background:#e8e0f4}
.item.ready{background:linear-gradient(90deg,rgba(255,201,77,.18),transparent)}.item.eq{background:linear-gradient(90deg,rgba(127,208,255,.22),transparent)}
.curw{border:3px solid var(--ink);border-left:12px solid var(--c);border-radius:16px;padding:8px 12px;background:#fff;display:flex;flex-direction:column;gap:2px;margin:6px 0}.curw span{font-size:13px;color:var(--mute)}
.pager{display:flex;justify-content:space-between;align-items:center;margin:4px 0}.pager button{width:52px;height:40px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}
.mreg{padding:8px 0;border-top:2px dashed rgba(58,47,74,.2)}.mreg h3 i,.zr h3 i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.mreg small,.zr>small{color:var(--mute);font-size:12.5px}
.hint{color:var(--mute);font-size:13.5px;line-height:1.5;margin:8px 0}
.note{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5}
.wbtn{width:100%;padding:12px;border-radius:16px;background:var(--leaf);color:#fff;font-size:19px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:8px 0}
.stats div{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:5px 10px}.stats small{display:block;font-size:12px;color:var(--mute)}.stats b{font-weight:400;font-size:19px}
.inv{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin-top:8px}
.sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#f4ece0;border:2.5px solid var(--ink);border-radius:16px;padding:6px;margin-top:6px}.sgrid.store{background:#e8e0f4}
.slot{position:relative;aspect-ratio:1;border:2.5px solid var(--ink);border-radius:11px;background:#fff;box-shadow:0 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;min-width:0}
.slot i{width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid var(--ink)}.slot span{font-size:10px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot b{position:absolute;right:3px;bottom:0;font-weight:400;font-size:11px}
.slot.empty{background:rgba(255,255,255,.45);border-style:dashed;box-shadow:none}
.mapsel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#fff6c8;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;font-size:14px;margin:6px 0}.mapsel i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.sm{padding:2px 10px;border-radius:10px;font-size:12.5px;box-shadow:0 2px 0 var(--ink)}
.mapw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
#bigmap{width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;background:#e8e0d0}
.zl{display:flex;flex-direction:column;gap:2px;max-height:460px;overflow:auto}
.zr{padding:6px 0;border-top:2px dashed rgba(58,47,74,.2)}.zr.hl{background:#fff6c8;border-radius:10px}
.zr em{font-style:normal;font-size:12px;border-radius:999px;padding:0 7px;background:#ffe0a0}.zr em.ok{background:#d4f6e2}
.crew{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.cr{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px;padding:8px 4px;text-align:center}.cr.on{background:#d4f6e2}.cr.lost{opacity:.6}.cr b{font-weight:400;font-size:15px}.cr small{font-size:12px;color:var(--mute)}
.ptw{width:64px;height:84px;display:flex;align-items:center;justify-content:center}.ptw.q{font-size:30px;color:#c8b8c8;background:#f4ece0;border-radius:14px;border:2.5px dashed var(--ink)}
canvas.chibi{width:64px;height:84px}.ptw.big,.ptw.big canvas.chibi{width:110px;height:144px}
.crewv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}.say{font-size:17px;line-height:1.6;margin:6px 0}.perk{font-size:14px;background:#e4fbef;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;margin:0}
.tbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.tbtns.col{flex-direction:column}
.big{flex:1;min-width:150px;padding:12px 16px;border-radius:18px;background:var(--leaf);color:#fff;font-size:20px;display:flex;flex-direction:column;align-items:center;line-height:1.2}.big small{font-size:12.5px;opacity:.9;margin-top:3px}.big.alt{background:var(--cream);color:var(--ink)}
.how{text-align:left;margin:14px 0 0;padding:10px 12px 10px 28px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;line-height:1.8;font-size:14px}.how b{font-weight:400;color:var(--berry)}
.reset{margin-top:14px;background:transparent;border:none;box-shadow:none;color:var(--mute);font-size:14px;text-decoration:underline;padding:6px}
.netl{color:var(--mute);font-size:12.5px;text-align:center;margin:12px 0 0}
.sheet.title{max-width:560px;text-align:center;background:linear-gradient(#fffaf0,#fff1e0)}
.logo .badge{display:inline-block;background:var(--ink);color:var(--cream);border-radius:999px;padding:3px 14px;font-size:14px}
.logo h1{margin:8px 0 6px;font-weight:400;font-size:clamp(44px,10vw,70px);line-height:1;color:var(--berry);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.logo h1 span{color:var(--gold)}
.lede{font-size:15px;line-height:1.6;color:var(--ink);margin:8px 0;text-align:left}
.faint{text-align:center}.faint p{color:var(--mute)}
/* VN */
.vn{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left));cursor:pointer;background:linear-gradient(to top,rgba(58,47,74,.5),transparent 60%)}
.vn-in{width:min(860px,100%);display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;background:var(--cream);border:3px solid var(--ink);border-radius:24px;padding:14px 18px;box-shadow:0 6px 0 var(--ink)}
.vn-pt canvas.chibi{width:92px;height:121px;display:block}
.vn-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.vn-name{margin:0;font-size:21px;color:var(--berry)}.vn-name small{font-size:12.5px;color:var(--mute);margin-left:8px}
.vn-text{margin:0;font-size:18px;line-height:1.6;min-height:3.2em;white-space:pre-wrap}
.vn.narr .vn-in{grid-template-columns:minmax(0,1fr);text-align:center;background:var(--ink);color:var(--cream)}
.vn-hint{margin:0;font-size:12px;color:var(--mute);text-align:right}
#nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:18px;z-index:20;background:var(--sky)}
/* desktop vs touch */
body:not(.touch) #stick,body:not(.touch) .rot{display:none}

.cstat div{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:6px;text-align:center}.cstat small{display:block;color:var(--mute);font-size:12px}.cstat b{font-weight:400;font-size:19px}
.cbox{margin-top:12px;background:#c69a62;border:3px solid #5a3a1a;border-radius:12px;padding:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.cbox h3{margin:0 0 6px;font-weight:400;font-size:16px;color:#fff;display:flex;align-items:center;gap:6px;text-shadow:0 1px 0 #5a3a1a}.cbox h3 i{width:12px;height:12px;border-radius:3px;border:2px solid #fff}.cbox h3 small{margin-left:auto;font-size:13px;opacity:.9}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ccell{background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;border-radius:4px;padding:5px 4px 4px;display:grid;justify-items:center;gap:2px;min-width:0}
.ccell i{width:28px;height:28px;border-radius:5px;background:var(--c);border:2px solid rgba(0,0,0,.35);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.3)}
.ccell span{font-size:11px;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 #333}
.ccell b{font-weight:400;font-size:14px;color:#fff;text-shadow:1px 1px 0 #333;font-variant-numeric:tabular-nums}
.ccell.none{opacity:.45}.ccell.none i{filter:grayscale(1)}

#announce{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px));background:rgba(58,47,74,.55);opacity:0;pointer-events:none;transition:opacity .35s}
#announce.on{opacity:1;pointer-events:auto}
#announce .anbox{background:#fff6d8;border:4px solid var(--ink);border-radius:32px;box-shadow:0 10px 0 var(--ink);padding:26px 22px;max-width:620px;width:100%;text-align:center;transform:scale(.6) rotate(-4deg);transition:transform .5s cubic-bezier(.2,1.7,.4,1)}
#announce.on .anbox{transform:none}
#announce.war .anbox{background:#ffe0e4}
#announce .anico{font-size:clamp(64px,14vw,110px);line-height:1;animation:anbob 1s ease-in-out infinite alternate}
#announce h1{margin:6px 0 8px;font-weight:400;font-size:clamp(34px,8vw,64px);color:var(--berry);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink);text-wrap:balance}
#announce.fence h1{color:#e0a050}
#announce p{margin:0;font-size:clamp(16px,3.6vw,22px);line-height:1.5;color:var(--ink)}#announce p b{color:var(--berry);font-weight:400}
#announce small{display:block;margin-top:12px;color:var(--mute)}
@keyframes anbob{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-10px) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){#announce .anico{animation:none}}

.fsw{display:inline-block;width:14px;height:14px;border-radius:4px;border:2px solid var(--ink);vertical-align:-2px;margin-right:4px}.wtip{margin:2px 0 6px;font-size:13px}

.wallbar .wtog{background:#fff;color:var(--ink)}.wallbar .wtog.on{background:#3a8ef0;color:#fff}

.dday{font-weight:400;margin-left:6px;padding:1px 8px;border-radius:999px;background:#3a2f4a;color:#fff;font-size:.9em}.dday.fence{background:#e0a050}.dday.war{background:#e05a5a}

#siegeGo{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);padding:8px 16px;border-radius:999px;background:#e05a5a;color:#fff;font-size:16px;box-shadow:0 4px 0 var(--ink);animation:sgpulse 1.2s ease-in-out infinite}
#siegeGo:active{transform:translateX(-50%) translateY(3px);box-shadow:0 1px 0 var(--ink)}
@keyframes sgpulse{50%{filter:brightness(1.15)}}@media (prefers-reduced-motion:reduce){#siegeGo{animation:none}}

.cbox.gem{background:#6a5a9a;border-color:#2e2450}

.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.medal{border:2.5px solid var(--ink);border-radius:14px;background:#f2eef6;padding:8px;display:grid;gap:3px;opacity:.75}
.medal.on{background:#fff6d8;opacity:1;box-shadow:0 3px 0 var(--ink)}
.medal i{font-style:normal;font-size:26px;filter:grayscale(1)}.medal.on i{filter:none}
.medal b{font-weight:400;font-size:15px}.medal small{color:var(--mute);font-size:12px;line-height:1.3}
.mbarx{height:8px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}.mbarx em{display:block;height:100%;background:#7ed957}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ttl{border:2px solid var(--ink);border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:6px;background:#f2eef6;opacity:.7}.ttl.on{background:#fff6d8;opacity:1}
.ttl i{width:12px;height:12px;border-radius:3px;border:2px solid var(--ink);flex:none}.ttl b{font-weight:400;font-size:13px;flex:1;min-width:0}.ttl small{color:var(--mute);font-size:11px}
.ntable{display:grid;gap:4px;margin:8px 0}
.nrow{display:grid;grid-template-columns:44px 1fr 90px minmax(0,1.3fr);gap:8px;align-items:center;border-bottom:1.5px dashed rgba(58,47,74,.2);padding:3px 0}
.nrow.nh{font-size:12px;color:var(--mute);border:none}
.nrow .ptw.sm{width:40px;height:40px;display:block;overflow:hidden}.nrow .ptw.sm canvas{width:40px;height:40px}
.nin{font:inherit;font-size:15px;padding:6px 8px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);min-width:0;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text;touch-action:auto}

.dock .wardb{background:#ffe0f0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.witem{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:8px;display:grid;justify-items:center;gap:4px;text-align:center}
.witem.on{background:#fff6d8;box-shadow:0 3px 0 var(--ink)}
.witem .wpv{width:72px;height:90px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.witem .wpv canvas{width:72px;height:auto}
.witem b{font-weight:400;font-size:14px}.witem small{color:var(--berry)}.witem .cost{font-size:11px;display:flex;flex-wrap:wrap;gap:3px;justify-content:center}

/* 프로필: 내 캐릭터 온몸이 보이게 (옷장에서 갈아입으면 바로 바뀌어요) */
.ava{height:78px;width:56px}
.ava canvas{left:1px;top:-1px;width:54px;height:71px}
.ava b{line-height:14px;font-size:10.5px}

.witem small.rare{color:#a06a00;font-size:11px;line-height:1.3}

#bV{position:absolute;left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:58px;height:52px;border-radius:16px;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;background:#fff}
#bV small{font-size:10px;margin-top:2px}#bV.on{background:#3a8ef0;color:#fff}

#bU{position:absolute;right:0;bottom:calc(100% + 12px);width:62px;height:62px;border-radius:50%;background:linear-gradient(#ffd23a,#ff8a3a);color:#3a2f4a;font-size:22px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:sgpulse 1.2s ease-in-out infinite}
#bU small{font-size:11px}
body.touch #bU{right:92px;bottom:138px;left:auto;top:auto;width:54px;height:54px}
.ultbar{position:relative;width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;padding:10px 14px;margin:6px 0 10px;border-radius:16px;background:#fff6d8;overflow:hidden;text-align:left}
.ultbar span,.ultbar b,.ultbar small{position:relative;z-index:1}.ultbar b{font-weight:400;font-size:22px;color:#e06a00}.ultbar small{color:var(--mute);font-size:12px}
.ultbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,180,60,.28);z-index:0}
.nrow.ur{grid-template-columns:minmax(0,1.6fr) 90px minmax(0,1fr)}

#introc{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-30px);opacity:0;pointer-events:none;z-index:40;background:#3a2f4a;color:#fff;border:3px solid #ffd23a;border-radius:16px;padding:6px 18px;display:grid;justify-items:center;transition:transform .35s cubic-bezier(.2,1.6,.4,1),opacity .3s}
#introc.on{opacity:1;transform:translate(-50%,0)}#introc b{font-weight:400;font-size:20px}#introc small{color:#ffd23a;font-size:12px}

#itembar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);display:flex;gap:6px;pointer-events:auto;z-index:3}
#itembar button{width:48px;height:48px;border-radius:14px;font-size:20px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;box-shadow:0 3px 0 var(--ink)}
#itembar button small{font-size:10px}#itembar button:disabled{opacity:.35}
body.touch #itembar{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:calc(50% - 40px)}

.ultone{display:flex;gap:8px;align-items:center;margin:10px 0}.ultone .nin{font-size:20px;padding:10px}
.eqcell{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#fogv{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(circle at 50% 55%,transparent 16%,rgba(205,200,220,.7) 42%,rgba(195,190,210,.96) 72%);z-index:4}#fogv.on{opacity:1}
/* ===== HUD v2 — 버튼 정리 (모든 기기 같은 자리) ===== */
#hud .btns{position:absolute;display:block;width:0;height:0;right:max(14px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:none;left:auto;top:auto}

#hud .btns>button:active{transform:translateY(3px)}
#hud #bA{right:0;bottom:0;width:96px;height:96px;font-size:22px;border-radius:50%}
#hud #bR{right:106px;bottom:2px;width:60px;height:60px;font-size:14px;border-radius:50%}
#hud #bF{right:96px;bottom:74px;width:56px;height:56px;font-size:14px;border-radius:50%}
#hud #bE{right:18px;bottom:108px;width:58px;height:44px;font-size:16px}
#hud #bQ{right:18px;bottom:160px;width:58px;height:40px;font-size:14px}
#hud #bU{right:164px;bottom:72px;width:56px;height:56px;border-radius:50%}

#hud #bV{left:max(20px,calc(env(safe-area-inset-left,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 160px);width:56px;height:50px}
#hud .rot{left:calc(max(20px,calc(env(safe-area-inset-left,0px) + 20px)) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 164px);gap:6px}

@media (max-height:500px){
  
  
  
  #hud #bA{width:84px;height:84px}#hud #bR{right:92px;width:54px;height:54px}#hud #bF{right:84px;bottom:64px;width:50px;height:50px}#hud #bE{bottom:94px;width:52px;height:40px;right:14px}#hud #bQ{bottom:140px;right:14px;width:52px;height:36px}#hud #bU{right:142px;bottom:62px;width:50px;height:50px}
  #hud #bT{bottom:calc(env(safe-area-inset-bottom,0px) + 128px);right:calc(max(14px,env(safe-area-inset-right)) + 86px);width:50px;height:44px}
  #hud #stick{width:110px;height:110px}#hud #bV{bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:50px;height:44px}#hud .rot{bottom:calc(env(safe-area-inset-bottom,0px) + 142px);left:calc(max(20px,calc(env(safe-area-inset-left,0px) + 20px)) + 58px)}#hud .rot button{width:38px;height:38px}
}

#hud .rot,#hud .rot button{display:none!important}
#hud #vilc{display:none!important}
body:not(.touch) #hud #bV{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}

#hud #bU{animation:none;box-shadow:0 0 0 3px #fff6c8,0 4px 0 var(--ink)}#hud #bU.cd{background:#c9c2d6;box-shadow:0 4px 0 var(--ink)}#hud #bU.cd small{font-size:13px}

/* 📍 왼쪽 위 한 줄: 프로필 → (같은 폭) 길 안내 → 아이템 — 화면 가운데를 가리지 않게 */
#hud .lcol{display:flex;flex-direction:column;align-items:stretch;gap:5px;width:min(300px,44vw);pointer-events:none}
#hud .lcol .prof{width:auto}
#hud .lcol .obj{display:flex;align-items:center;gap:6px;width:auto;max-width:none;min-width:0;height:30px;padding:0 8px;font-size:12.5px;line-height:1;border-radius:12px;white-space:nowrap;overflow:hidden}
#hud .lcol #objt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#hud .lcol #oarr{flex:none;width:20px;height:20px;line-height:18px;font-size:11px;border-width:2px}
#hud .lcol #odist{flex:none;font-size:11px}
#hud #itembar{position:static;transform:none;display:flex;gap:5px;pointer-events:auto}
#hud #itembar[hidden]{display:none}
#hud #itembar button{width:38px;height:38px;border-radius:12px;font-size:17px;box-shadow:0 2px 0 var(--ink);position:relative;display:flex;align-items:center;justify-content:center;line-height:1}
#hud #itembar button small{position:absolute;right:-5px;bottom:-6px;background:var(--ink);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px}
#hud #itembar button:disabled{display:none}
@media (max-width:900px),(max-height:500px){#hud .lcol{width:min(250px,56vw)}#hud .lcol .obj{height:26px;font-size:11.5px}#hud #itembar button{width:34px;height:34px;font-size:15px}}

/* 📱 폰(가로 화면 높이 500 이하): 가운데 싸움터를 비워 두기 */
@media (max-height:500px){
  body.touch #hud .dock{display:flex;flex-direction:row;grid-template-columns:none;gap:4px;top:calc(env(safe-area-inset-top,0px) + 46px);right:max(10px,env(safe-area-inset-right));left:auto;bottom:auto}
  body.touch #hud .dock button{width:40px;height:38px;font-size:15px;border-radius:11px}
  body.touch #hud .dock button small{font-size:8.5px}
  #hud #banner{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;transform:translateX(-50%);max-width:calc(100vw - 380px);font-size:11px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast{font-size:14px;padding:6px 14px;top:30%;border-radius:14px;max-width:min(360px,60vw)}
  #toasts{width:min(300px,45vw)!important;top:calc(env(safe-area-inset-top,0px) + 175px)!important}
  .stoast{font-size:12px;padding:3px 9px;border-radius:11px}
  #hud .tc,body.touch #hud .tc{top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);width:auto;align-items:center}
}

/* 길 안내: 한 번 누르면 3배로 크게(글씨 다 보이게), 또 누르면 원래대로 */
#hud .lcol .obj{pointer-events:auto;cursor:pointer;transition:height .15s}
body.objbig #hud .lcol .obj{height:auto;min-height:90px;padding:8px 10px;font-size:15px;line-height:1.35;white-space:normal;align-items:center;gap:10px}
body.objbig #hud .lcol #objt{white-space:normal;overflow:visible;text-overflow:clip}
body.objbig #hud .lcol #oarr{width:34px;height:34px;line-height:31px;font-size:18px}
body.objbig #hud .lcol #odist{font-size:15px;font-weight:700;color:var(--ink)}
@media (max-width:900px),(max-height:500px){body.objbig #hud .lcol .obj{min-height:78px;font-size:13.5px}}

/* 👹 대군과 싸우기 (그날만) */
#siegeCall{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;gap:6px;align-items:center}
#siegeCall .go{padding:8px 16px;border-radius:999px;background:#e05a5a;color:#fff;font-size:15px;box-shadow:0 4px 0 var(--ink);border:3px solid var(--ink)}

#hud #bQ{background:#ffe27a;font-size:17px;flex-direction:column;line-height:1}#hud #bQ small{font-size:10px}

/* 🧭 미니맵: 명찰 오른쪽 · 명찰과 같은 높이 · 폭은 명찰의 절반 */
#hud .prow{position:relative}
#hud .prow #mini{position:absolute;left:calc(100% + 8px);top:0;width:50%;height:100%;border:3px solid var(--ink);border-radius:14px;background:#16141c;box-shadow:0 3px 0 var(--shade);pointer-events:auto;cursor:pointer}
#hud .prow #mini[hidden]{display:none}

/* 🌍 나라 지도 */
.wmap{margin:6px 0 8px;padding:8px 10px;border:2.5px solid var(--ink);border-radius:14px;background:#f2fbff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wmh{display:flex;flex-direction:column;gap:2px;flex:1;min-width:180px}.wmh small{color:var(--mute);font-size:12px}
.wgrid{display:grid;gap:4px}

#hud #bS small{font-size:10px}#hud #bS.on{background:#ffe27a}

@media (max-height:500px){#hud #bS{bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:50px;height:44px;left:calc(max(20px,calc(env(safe-area-inset-left,0px) + 20px)) + 58px)}}

/* ✨ 바니쉬: 마지막 다듬기 — 움직임은 transform/opacity만 써서 가벼워요 */
@keyframes sheetIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.overlay:not([hidden]) .sheet{animation:sheetIn .2s cubic-bezier(.2,.9,.3,1.2)}
.sheet button:not(:disabled){transition:transform .08s,filter .12s}
.sheet button:not(:disabled):active{transform:translateY(2px) scale(.97);filter:brightness(.95)}
#hud .dock button:active,#hud #bV:active,#hud #bS:active,#hud #itembar button:active{transform:translateY(2px) scale(.96)}
#hpf,#hgf,#stf,#xpf,#bossf{transition:width .25s ease-out}
#lowhp{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(255,40,70,.5) 100%);transition:opacity .4s}
#lowhp.on{animation:lowpulse 1.1s ease-in-out infinite}
@keyframes lowpulse{0%,100%{opacity:.35}50%{opacity:.9}}

const tierOf=k=>{const i=k%N,j=k/N|0;return Math.max(Math.abs(i-C),Math.abs(j-C));};
function regionOf(k){const i=k%N,j=k/N|0,dx=i-C,dy=j-C,t=Math.max(Math.abs(dx),Math.abs(dy));
  if(t<=1)return 0;if(t>=8){const a=Math.atan2(dy,dx);return a<-Math.PI/3&&a>=-Math.PI?RI.sky:a<Math.PI/3?RI.candy:RI.deep;}if(t===7)return RI.shadow;
  if(t<=4){if(Math.abs(dy)>=Math.abs(dx))return dy<0?RI.flower:RI.swamp;return dx>0?RI.mush:RI.rock;}
  if(dx>=0&&dy<0)return RI.ice;if(dx>=0)return RI.crystal;if(dy>=0)return RI.oldwood;return RI.lava;}
const REGK=[];for(let k=0;k<N*N;k++)REGK.push(regionOf(k));

function wavesOf(k){if(isBoss(k))return 1;return[0,2,3,3,4,4,5,5,5,6,6][tierOf(k)]||6;}
function zoneOf(x,z){const i=Math.floor((x+HALF)/TS),j=Math.floor((z+HALF)/TS);if(i<0||j<0||i>=N||j>=N)return-1;return j*N+i;}
function zc(k){return{x:-HALF+(k%N)*TS+TS/2,z:-HALF+(k/N|0)*TS+TS/2};}
function claimable(k){if(k<0||G.owned[k])return false;const i=k%N,o=G.owned;return!!((i<N-1&&o[k+1])||(i>0&&o[k-1])||(k+N<N*N&&o[k+N])||(k>=N&&o[k-N]));}
function zcx(k){return-HALF+(k%N)*TS+TS/2;}function zcz(k){return-HALF+(k/N|0)*TS+TS/2;}

/* 다 정복한 나라: 그 나라엔 이제 몬스터가 없으니, 그 나라 재료는 다른 나라 몬스터가 대신 떨어뜨려요 */
let DONEC=null,DONEV=-1;
function doneRegions(){if(!G)return[];let n=0;for(let k=0;k<N*N;k++)if(G.owned[k])n++;if(DONEC&&DONEV===n)return DONEC;DONEV=n;const left=new Array(REG.length).fill(0);for(let k=0;k<N*N;k++)if(!G.owned[k])left[REGK[k]]++;DONEC=REG.map((r,i)=>i).filter(i=>!left[i]);return DONEC;}
function dropsOf(ri,L,boss){const r=REG[ri];const sp=r.res;const qb=1+L/8;const got={};const add=(id,q)=>{got[id]=(got[id]||0)+Math.max(1,Math.round(q));};
  if(boss){sp.forEach((id,i)=>add(id,qb*3+(5-i)*2));for(const id of EXTRA[r.id]||[])if(RES3SET.has(id))add(id,2+qb);return got;}
  const far=r.far?1.6:1;const over=Math.max(0,L-r.min);const w=[10,6,3+over*0.3];const tw=w.reduce((a,b)=>a+b,0);const n=1+(Math.random()<0.5?1:0);
  for(let i=0;i<n;i++){let x=Math.random()*tw,q=0;while(x>w[q]){x-=w[q];q++;}add(sp[q],(qb*(1-q*0.15)+Math.random())*far);}
  if(r.id==='home'&&Math.random()<0.3)add('berry',1+qb*0.5);
  {const dn=doneRegions();if(dn.length&&Math.random()<0.45){const R2=REG[dn[Math.floor(Math.random()*dn.length)]];add(R2.res[Math.floor(Math.random()*3)],qb*0.9+Math.random()*2);}}
  if(Math.random()<0.35&&EXTRA[r.id])add(pick(EXTRA[r.id]),1+Math.random()*qb*0.5);return got;}

  const R=REG[ri];const od=oddsFor(k);if(boss&&rush){btToast(`⚠ 순서를 건너뛴 보스 도전!<small>${R.bossName}의 힘이 5배! (평소 보스의 체력 5배) · 이기면 보상도 2배 · 전력 <b style="color:${od[1]}">${od[0]}</b></small>`);sfx('horn');}
  else if(boss){btToast(`보스 등장! ${R.bossName}<small>노랗게 떨면 곧 돌진 · 빨간 원은 피하세요 · 전력 ${od[0]}</small>`);sfx('horn');}
  else if(camp){btToast(`⛺ 적 야영지! 🙂 중수 · 😤 준고수 + 적장<small>한꺼번에 몰려와요 · 전력 비교 <b style="color:${od[1]}">${od[0]}</b> · 적장을 쓰러뜨리면 기세가 꺾여요</small>`);sfx('horn');}
  else if(false){btToast(`🐝 ${R.name} · 떼거리 땅!<small>약한 몬스터 ${BATTLE.total}마리가 한꺼번에 몰려와요 · 전력 ${od[0]}</small>`);sfx('horn');}
  else if(false){btToast(`💪 ${R.name} · 거대 정예 땅!<small>커다란 정예 몬스터와 호위 둘 · 전력 ${od[0]}</small>`);sfx('horn');}
  /* 보통 몬스터 3마리 싸움은 시작 문구를 띄우지 않아요 */
  updateBanner();}
function startRaid(k){const ri=REGK[k];BATTLE={k,ri,raid:1,multi:1,style:'trio',wave:0,total:3,next:1.4};bigToast(`🔥 습격을 막아라!<small>🙂 중수 · 😤 준고수 · 😠 고수 3마리가 마을 땅을 노려요</small>`);sfx('horn');updateBanner();}
/* power comparison (from 백국: 압도적 · 유리 · 팽팽 · 불리 · 무모) */
function ourPower(){const W=weaponOf(G.weapon);let dps=W.dmg*atkBonus()/Math.max(0.3,W.cd)*0.5*(W.multi||1)*(W.aoe?1.3:1),hp=maxHP();const base=Math.max(W.dmg,12)*atkBonus();
  for(const f of ARMY){const S=SOLDIER[f.kind];const fac=(S?S.f:ELITE_F[f.kind]||0.4)*minionMul(f);dps+=base*fac/(S?S.cd:0.85)*0.7;hp+=minionMax(f)*0.7;}return[dps,hp];}
function foeList(k){const ri=REGK[k],R=REG[ri];const L0=monLevelFor(k,0);const one=(kind,L,m)=>{const M=MON[kind],S=mstat(L);return{hp:S.hp*(M.hpM||1)*(m||1),atk:S.atk*(M.atkM||1)};};
  const L=L0+1;const a=one(R.mon,L,1.6),b=one(R.mon,L+1,2.0);a.atk*=1.3;b.atk*=1.45;let c;if(isBoss(k))c=one(R.boss,L+2,claimable(k)?1:5);else if(CAMPT[k]){const S=mstat(L+2);c={hp:S.hp*3.2,atk:S.atk*1.2};}else{c=one(R.mon,L+2,2.6);c.atk*=1.6;}return{list:[a,b,c],multi:1};}
function oddsFor(k,fl){const[d,h]=ourPower();const F=fl||foeList(k);const fh=F.list.reduce((a,b)=>a+b.hp,0);let fd=F.multi?F.list.reduce((a,b)=>a+b.atk/1.7,0):F.list.reduce((a,b)=>a+b.atk/1.7,0)/F.list.length;fd*=1+nightK()*0.2;
  const r=h*d/(fh*ddaHP()*fd*ddaAtk()*2.5);return r>=1.6?['압도적','#3aa860']:r>=1.15?['유리','#5fae4a']:r>=0.95?['팽팽','#e09a20']:r>=0.7?['불리','#e05a5a']:['무모','#c0304a'];}
function altKind(B){const R=REG[B.ri];if(B.ri>=2&&Math.random()<0.3){const o=REG[Math.max(1,B.ri-1-(Math.random()<0.5?1:0))];return o.mon;}return R.mon;}
function spawnNext(){const B=BATTLE;const p=zc(B.k);const R=REG[B.ri];if(B.multi){spawnMulti();return;}let L=monLevelFor(B.k,B.wave);let kind=altKind(B);if(B.boss){kind=R.boss;L+=2;}
  let x,z,t=0;do{x=p.x+(Math.random()-.5)*(TS-5);z=p.z+(Math.random()-.5)*(TS-5);t++;}while(Math.hypot(x-P.x,z-P.z)<(B.boss?9:6)&&t<40);
  const m=addMon(kind,x,z,L,{tile:B.k});if(B.rush){m.hp=m.max=m.hp*5;m.atk=Math.round(m.atk*2);m.rush=1;}sfx('appear');if(!B.boss&&tierOf(B.k)>=2&&B.wave>=1&&B.wave%2===1&&B.total-B.wave>=2){let x2=p.x+(Math.random()-.5)*(TS-5),z2=p.z+(Math.random()-.5)*(TS-5);addMon(kind,x2,z2,Math.max(1,L-1),{tile:B.k});B.extra=(B.extra||0)+1;smallToast('둘이 한꺼번에 왔어요!','bad');}
  if(!B.boss)smallToast(`${B.wave+1}/${B.total} · Lv ${L} ${MON[kind].name}`,'bad');}

function spawnTrio(){const B=BATTLE;const p=zc(B.k);const R=REG[B.ri];const L=monLevelFor(B.k,0)+1+(B.raid?Math.floor(G.stats.tiles/6):0);
  const spot=(i)=>{const a=Math.atan2(p.z-P.z,p.x-P.x)+(i-1)*0.7;let x=P.x+Math.cos(a)*8,z=P.z+Math.sin(a)*8;x=clamp(x,p.x-TS/2+2,p.x+TS/2-2);z=clamp(z,p.z-TS/2+2,p.z+TS/2-2);return[x,z];};
  const mk=(i)=>{const[x,z]=spot(i);if(i===2&&B.boss){const m=addMon(R.boss,x,z,L+2,{tile:B.k,rank:2});if(B.rush){m.hp=m.max=m.hp*5;m.atk=Math.round(m.atk*2);m.rush=1;}return;}
    if(i===2&&B.camp){const gk=R.boss||'kingslime';const S=mstat(L+2);const m=addMon(gk,x,z,L+2,{tile:B.k,boss:false,gen:1,rank:2});m.hp=m.max=Math.round(S.hp*3.2*ddaHP());m.atk=Math.round(S.atk*1.2*ddaAtk());m.size=MON[gk].size*0.72;m.spd=MON[R.mon].spd*1.05;m.xp=S.xp*5;return;}
    const kind=i===0?R.mon:altKind(B);const RK=MRANK[i];const m=addMon(kind,x,z,L+RK[0],{tile:B.k,rank:i,spawn:0.4+i*0.25});
    m.hp=m.max=Math.max(1,Math.round(m.hp*RK[1]));m.atk=Math.max(1,Math.round(m.atk*RK[2]));m.size*=RK[3];if(i===1&&Math.random()<0.1){m.golden=1;m.hp=m.max=Math.round(m.max*1.3);}};
  for(let i=0;i<3;i++)mk(i);B.wave=0;sfx('appear');}
function spawnMulti(){const B=BATTLE;if(B.spawnFn){B.spawnFn();return;}if(B.style==='trio'){spawnTrio();return;}const p=zc(B.k);const R=REG[B.ri];const L=monLevelFor(B.k,1)+(B.raid?Math.floor(G.stats.tiles/6):0);const n=B.total-B.wave-(B.camp&&!B.genDone?1:0);
  const spot=()=>{let x,z,t=0;do{x=p.x+(Math.random()-.5)*(TS-4);z=p.z+(Math.random()-.5)*(TS-4);t++;}while(Math.hypot(x-P.x,z-P.z)<7&&t<40);return[x,z];};
  for(let i=0;i<n;i++){const[x,z]=spot();if(B.style==='elite'&&i===0){const m=addMon(altKind(B),x,z,L+2,{tile:B.k,spawn:0.5,trait:'giant'});m.elite=true;m.hp=m.max=Math.round(m.hp*1.5);continue;}addMon(B.style==='swarm'?altKind(B):R.mon,x,z,B.style==='swarm'?Math.max(1,L-2):L,{tile:B.k,spawn:0.5+i*0.12});}
  if(B.camp&&!B.genDone){const gk=R.boss||'kingslime';const[x,z]=spot();const S=mstat(L+2);const m=addMon(gk,x,z,L+2,{tile:B.k,boss:false,gen:1});m.hp=m.max=Math.round(S.hp*4);m.atk=Math.round(S.atk*1.3);m.size=MON[gk].size*0.72;m.spd=MON[R.mon].spd*1.05;m.xp=S.xp*5;}
  sfx('appear');smallToast(B.camp?`몬스터 ${n}마리와 적장이 몰려와요!`:`습격 몬스터 ${n}마리!`,'bad');}
function endBattle(silent){MONS=[];SHOTS=[];TELE=[];BATTLE=null;$('#bossbar').hidden=true;if(!silent)updateBanner();}
function ddaAdjust(win){if(!G)return;const r=G.hp/maxHP();let d=G.dda||1;if(win){d+=r>0.8?0.06:r>0.55?0.03:r<0.25?-0.04:0;}else d-=0.12;G.dda=clamp(d,0.85,3);}
/* ---------- 땅따먹기 전투를 더 짜릿하게 ----------
   😤 복수: 같은 땅의 몬스터가 쓰러지면 남은 몬스터가 화나요
      · 더 센 몬스터를 먼저 쓰러뜨리면 → 남은 약한 몬스터가 한 등급씩 올라가요 (중수→준고수, 준고수→고수)
      · 약한 몬스터를 먼저 쓰러뜨리면 → 남은 몬스터의 공격·속도가 조금 세져요
   ✨ 황금 몬스터: 가끔(10%) 준고수가 황금빛으로 나와요 — 재료 3배 */
function promoteMon(o){const r=o.rank,A=MRANK[r],B2=MRANK[r+1];const hr=B2[1]/A[1],ar=B2[2]/A[2];o.max=Math.round(o.max*hr);o.hp=Math.round(o.hp*hr);o.atk=Math.round(o.atk*ar);o.size*=B2[3]/A[3];o.L+=1;o.rank=r+1;o._lbl=null;o.flash=0.4;burst(o.x,o.z,1.4,[255,90,90],14,4);floater(o.x,o.z,3.6,`😤 ${RANKN[r+1]}(으)로 변신!`,'#ff5a5a',2);}
function winBattle(){const B=BATTLE;const k=B.k;vetXP();ddaAdjust(true);
  if(B.ambush){endBattle(true);reviveAll(0.6);ambushWin(B);updateBanner();save(true);return;}
  if(B.raid){endBattle(true);reviveAll(0.6);const got=bonusMats(B.ri,monLevelFor(k,1),1);giveMats(got);G.raid=null;G.stats.raids++;sfx('fanfare');bigToast(`마을을 지켰다!<small>고마운 백성들이 재료를 모아 줬어요 · ${matList(got)}</small>`);burst(P.x,P.z,1.2,[255,230,120],40,7);updateBanner();save(true);return;}
  G.owned[k]=1;G.stats.tiles++;logClaim(k);questEv('claim');if(B.camp)questEv('camp');const L=monLevelFor(k,B.total);const got=dropsOf(B.ri,L,B.boss);if(B.rush)for(const q in got)got[q]*=2;{const sb=squadBonus();if(sb>1){for(const q in got)got[q]=Math.ceil(got[q]*sb);setTimeout(()=>smallToast(`👥 소수정예 보너스! 재료 ×${sb}`,'sat'),900);}}keyWin(k);if(rule('giant'))for(const q in got)got[q]*=2;if(Math.random()<0.3)luckGive();if(k===bountyK()){for(const q in got)got[q]*=3;G.bountyDay=G.day;G.ult=(G.ult||0)+8;setTimeout(()=>bigToast('⭐ 현상금 땅 정복!<small>재료 ×3 · 💥 필살기 게이지 +8</small>'),1200);}{const tm=traitMul(B);if(tm>1){for(const q in got)got[q]=Math.ceil(got[q]*tm);const L=TRAITL[B.lt];setTimeout(()=>smallToast(`${L[0]} ${L[1]} 보너스! 재료 ×${tm}`,'sat'),700);}}if(!B.boss){const r=tileRes(k);got[r]=(got[r]||0)+3+tierOf(k)*2;}
  endBattle(true);reviveAll(0.6);giveMats(got);buildGround();onClaim(k);sfx('fanfare');G.hp=Math.min(maxHP(),G.hp+maxHP()*0.3);burst(P.x,P.z,1.2,[255,230,120],40,7);
  const R=REG[B.ri];const n=owned();if(B.camp){const bm=bonusMats(B.ri,L,1.5);giveMats(bm);setTimeout(()=>smallToast(`🎁 야영지 창고: ${matList(bm)}`,'sat'),900);}
  if(B.camp){G.stats.camps++;const t=makeTreasure(k,'camp');G.treas.push(t);const pp2=G.vil.founded?3+tierOf(k):0;if(pp2)G.vil.people=Math.min(peopleCap()+pp2,G.vil.people+pp2);setTimeout(()=>bigToast(`⛺ 야영지 점령!<small>💎 보물 「${t.n}」 획득 · ${TEFF[t.e].n} +${Math.round(TEFF[t.e].v*100)}%${pp2?` · 갇혀 있던 주민 ${pp2}명이 마을로!`:''}</small>`),1700);}
  if(B.boss){const t=makeTreasure(k*3+1,'boss');G.treas.push(t);setTimeout(()=>smallToast(`💎 보물 「${t.n}」 — ${TEFF[t.e].n} +${Math.round(TEFF[t.e].v*100)}%`,'sat'),3200);}
  if(PRISON[k]&&!G.soldiers.some(q=>q.k===k)){G.soldiers.push({t:PRISON[k],k,xp:5});buildArmy();const S=SOLDIER[PRISON[k]];setTimeout(()=>bigToast(`부하 구출! ${S.name} 합류<small>${S.role} · 부대 ${ARMY.length}명</small>`),1500);}updateBanner();save(true);
  if(B.boss){G.stats.bosses++;worldBossStory();bigToast(`${R.bossName} 격파!<small>${R.name}의 왕관을 부쉈다</small>`);const q=[];
    if(R.who&&!G.crew[R.who].found){G.crew[R.who].found=1;for(const l of STORY.rescue[R.who])q.push(l);q.push(['narr',`${PEOPLE[R.who].name}${pp(PEOPLE[R.who].name,'이/가')} 부하가 되어 부대에 합류했다! 이제 늘 함께 싸운다.\n${PEOPLE[R.who].perk}.`]);buildArmy();}
    if(R.id==='shadow'&&!G.flags.ending){G.flags.ending=1;for(const l of STORY.ending)q.push(l);}if(q.length)setTimeout(()=>vn(q),1400);}
  else if(!B.camp)bigToast(n===N*N?'들판 전체가 내 땅!':`땅을 얻었어요! (${n}/${N*N})<small>이제 ${matName(tileRes(k))}${pp(matName(tileRes(k)),'이/가')} 대장간에 조금씩 쌓여요</small>`);}
/* ---------- infinite tower ---------- */
function towerRegion(f){return Math.min(9,Math.floor((f-1)/6)%10);}
function enterTower(){if(BATTLE)endBattle(true);ARENA_ON=true;MONS=[];SHOTS=[];TELE=[];P.x=ARENA.x;P.z=ARENA.z+ARENA.r-5;P.face=0;CAM.yaw=0;teleArmy();G.towerNext=0.8;bigToast(`무한의 탑 ${G.tower}층<small>층마다 중수·준고수·고수 3마리가, 끝없이 더 세게 나와요</small>`);sfx('horn');}
function leaveTower(){ARENA_ON=false;MONS=[];SHOTS=[];TELE=[];const p=zc(CK);P.x=p.x+CAMPOBJ.gate.x;P.z=p.z+CAMPOBJ.gate.z+2.2;P.face=0;teleArmy();CURZ=-2;updateBanner();save(true);}
function towerSpawn(){const f=G.tower;const ri=towerRegion(f);const R=REG[ri];const boss=f%10===0;const kind=boss?(R.boss||'kingslime'):R.mon;const L=1+Math.floor(f*1.15)+(boss?2:0);
  const a0=Math.random()*6.283;for(let i=0;i<3;i++){const a=a0+(i-1)*0.7,x=ARENA.x+Math.cos(a)*9,z=ARENA.z+Math.sin(a)*9;const RK=MRANK[i];
    if(i===2&&boss){addMon(kind,x,z,L,{tower:1,ri,rank:2});continue;}const m=addMon(R.mon,x,z,(boss?L-2:L)+RK[0],{tower:1,ri,rank:i,spawn:0.4+i*0.25});m.hp=m.max=Math.max(1,Math.round(m.hp*RK[1]));m.atk=Math.max(1,Math.round(m.atk*RK[2]));m.size*=RK[3];}
  smallToast(`${f}층 · 🙂 중수 · 😤 준고수 · ${boss?'👑 보스':'😠 고수'}`,'bad');sfx('appear');}

/* ---------- 이펙트 오브젝트 풀: 만들었다 버리지 않고 재사용 ---------- */
const PPOOL=[],FPOOL=[],BURSTK=[0.6,0.45,0.3],PMAX=120,FMAX=28;let PROLL=0;
function burst(x,z,y,col,n,sp){n=Math.ceil(n*BURSTK[QL]);const cr=col[0]/255,cg=col[1]/255,cb=col[2]/255;
  for(let i=0;i<n;i++){let p;if(PARTS.length>=PMAX){p=PARTS[PROLL];PROLL=(PROLL+1)%PMAX;}else{p=PPOOL.pop()||{x:0,z:0,y:0,vx:0,vz:0,vy:0,col:[0,0,0],t:0,life:0,s:0,o:{soft:1,tint:null,alpha:1}};PARTS.push(p);}
    const a=Math.random()*6.283,v=(sp||3)*(0.4+Math.random()*0.8);p.x=x;p.z=z;p.y=y;p.vx=Math.cos(a)*v;p.vz=Math.sin(a)*v;p.vy=2+Math.random()*3;p.col[0]=cr;p.col[1]=cg;p.col[2]=cb;p.t=0;p.life=0.5+Math.random()*0.4;p.s=0.18+Math.random()*0.12;}}
function floater(x,z,y,txt,col,size){const f=FLOATS.length>=FMAX?FLOATS.shift():(FPOOL.pop()||{x:0,z:0,y:0,txt:'',col:'',t:0,size:0});f.x=x;f.z=z;f.y=y;f.txt=txt;f.col=col;f.t=0;f.size=size||2.2;FLOATS.push(f);}
/* ---------- 나도 함께 싸워야 이기는 전투 ----------
   · 내가 3.5초 안에 몬스터를 때렸으면 부하들 힘 100%, 아니면 40%만 (구경만 하면 부하만으로는 잘 못 이김)
   · 전투 중에 기절한 부하는 저절로 못 일어남 → 부하가 다 쓰러지면 나 혼자 싸워야 할 수도!
   · 내가 직접 몬스터를 쓰러뜨리면 기절한 부하 1명이 벌떡 일어남, 전투가 끝나면 모두 일어남 */
let FIGHTING=false,RALLYON=false,ALLDOWN=false;

const MP={on:false,code:'',nick:'',state:'',peer:null,host:null,conns:new Map(),pres:{},others:new Map(),handlers:[],evh:{},myId:''};

function mpLoadLib(){return new Promise((ok,no)=>{if(window.Peer)return ok();const tryU=(urls)=>{if(!urls.length)return no(new Error('lib'));const s=document.createElement('script');s.src=urls[0];s.onload=()=>window.Peer?ok():tryU(urls.slice(1));s.onerror=()=>tryU(urls.slice(1));document.head.appendChild(s);};

/* Claude room과 같은 모양의 얇은 껍데기 */
const MPROOM={presence(p){Object.assign(MP.pres,p);if(MP.state==='host')mpBroadcast();else if(MP.host&&MP.host.open)try{MP.host.send({t:'p',p:MP.pres});}catch(e){}return Promise.resolve();},

  const ids=new Set(peers.map(p=>p.peer));const left=[];for(const[id]of NET.peers)if(!ids.has(id))left.push({peer:id});

let MPBT=0;function mpBroadcast(){const now=performance.now();if(now-MPBT<150)return;MPBT=now;const list=[{peer:MP.myId,presence:MP.pres}];for(const[id,o]of MP.others)list.push({peer:id,presence:o});

function mpClean(p){const o={};for(const k of['x','z','f','m','a','lv','t','ar','w','d','j'])if(typeof p[k]==='number')o[k]=p[k];if(typeof p.nk==='string')o.nk=p.nk.replace(/[<>&"']/g,'').slice(0,10);

/* 대군 물결: 평소 땅과 똑같이 3마리(🙂중수 · 😤준고수 · 😠고수), 체력 2배 · 공격 2배 · 마지막 물결은 고수 자리에 보스 */
function siegeWave(){const S=SIEGE;S.wave++;const R=REG[S.ri];const L=Math.max(3,Math.round(G.lv*0.85))+S.wave;
  /* 몬스터는 내 눈앞(보는 방향 10m)에, 들판 안에서만 나타나요 */
  const fx=-Math.sin(CAM.yaw),fz=-Math.cos(CAM.yaw),h=WARH-2;
  for(let i=0;i<3;i++){const x=clamp(P.x+fx*10+fz*(i-1)*4,SIEGEC.x-h,SIEGEC.x+h),z=clamp(P.z+fz*10-fx*(i-1)*4,SIEGEC.z-h,SIEGEC.z+h);const RK=MRANK[i];
    const boss=false;/* 대군은 딱 3마리 (보스 없이) */const kind=boss?R.boss:(i===1?REG[Math.max(1,S.ri-1)].mon:R.mon);
    const m=addMon(kind,x,z,L+RK[0],{siege:1,ri:S.ri,rank:i,spawn:0.4+i*0.25,noTrait:boss});m.hp=m.max=Math.max(1,Math.round(m.hp*RK[1]*2));m.atk=Math.max(1,Math.round(m.atk*RK[2]*2));m.size*=RK[3];}
  sfx('horn');CAM.shake=0.8;updateBanner();}
function runSiege(dt){const S=SIEGE;if(!ARENA_ON)return;if(S.coop){coopGuestTick(dt);if(!SIEGE)return;}const h=WARH-0.8,cx=SIEGEC.x,cz=SIEGEC.z;
  /* 모두 네 칸 들판 안에만 있어요 (숨을 수 없어요) */
  P.x=clamp(P.x,cx-h,cx+h);P.z=clamp(P.z,cz-h,cz+h);
  for(let i=0;i<MONS.length;i++){const m=MONS[i];m.x=clamp(m.x,cx-h,cx+h);m.z=clamp(m.z,cz-h,cz+h);}
  for(let i=0;i<ARMY.length;i++){const f=ARMY[i];f.x=clamp(f.x,cx-h,cx+h);f.z=clamp(f.z,cz-h,cz+h);}
  if(!S.go||S.coop)return;
  if(!MONS.length){S.next-=dt;if(S.next<=0){if(S.wave>=S.max){siegeOver(true);return;}siegeWave();S.next=3;}}}
function siegeOver(win,fainted){const S=SIEGE;if(!S)return;SIEGE=null;coopEnd(S,win);siegeGoBtn(false);removeCitizens();MONS=[];SHOTS=[];TELE=[];$('#bossbar').hidden=true;ARENA.x=TOWERA.x;ARENA.z=TOWERA.z;ARENA.r=TOWERA.r;
  if(win){const L=Math.max(3,G.lv);const got=bonusMats(S.ri,L,4*squadBonus());giveMats(got);const pp2=8;G.vil.people=Math.min(PEOPLE_MAX,G.vil.people+pp2);gainXP(Math.round(xpNeed()*0.6));G.stats.sieges=(G.stats.sieges||0)+1;
    const t=makeTreasure(7000+G.day,'camp');G.treas.push(t);setTimeout(()=>smallToast(`💎 보물 「${t.n}」 — ${TEFF[t.e].n} +${Math.round(TEFF[t.e].v*100)}%`,'sat'),3600);
    victoryParade();medalCheck();setTimeout(()=>bigToast(`🏆 대군을 막아 냈다!<small>👪 백성 +${pp2} · ${matList(got)}</small>`),800);sfx('fanfare');}
  else setTimeout(()=>bigToast(`💪 아쉽게 졌어요! 그래도 잃은 건 없어요<small>내일 0시에 다시 도전!</small>`),fainted?2500:800);
  setTimeout(goalCard,fainted?4200:3000);/* 📋 대군 싸움이 끝나면 오늘의 목표 카드 */
  if(fainted)return;
  const f=$('#fade');f.classList.add('on');setTimeout(()=>{ARENA_ON=false;const c=zc(CK);P.x=c.x;P.z=c.z+4.5;P.kx=P.kz=0;CURZ=-2;teleArmy();reviveAll(1);f.classList.remove('on');updateBanner();save(true);},600);}
/* ---------- 백성도 함께 싸워요: 성벽이 클수록, 백성이 많을수록 더 많이 ---------- */
const CITKIND=['sword','spear','bow','shield','sword','heal'];
function citizenCount(){const f=Math.min(1.4,0.4+wallTiles()*0.05);return Math.min([14,10,6][QL],Math.max(2,Math.floor((G.vil.people||0)/5*f)));}

/* ---------- ⚔ 전투 허락: 누르기 전에는 나만 움직이고, 몬스터·백성은 멈추고, 몬스터는 다치지 않아요 ---------- */

/* ================= 👥 친구와 함께 대군 막기 =================
   방장 = 먼저 들어온 사람. 방장이 대군 싸움을 시작하면 친구들 화면에 '⚔ 함께 막기' 버튼이 생겨요.
   몬스터는 방장 게임에서만 움직이고(진짜), 친구 화면엔 그 모습이 그대로 보여요(거울).
   친구가 때린 만큼은 '함께하기 정보(presence)'로 방장에게 전해져서 진짜 몬스터가 다쳐요. 쓰러지면 서로 살려 줘요 */
let COOPD={},HSEEN={},COOPHIT=0;
function coopHostOpen(){if(!multiOn()||SIEGE)return null;for(const[id,pr]of NET.peers){const w=pr&&pr.p&&pr.p.war;if(w&&w.h&&!w.done&&(pr.p.w||0)===(G.wi||0))return id;}return null;}
function coopBtn(host){let b=document.getElementById('siegeCall');if(b)b.remove();b=document.createElement('div');b.id='siegeCall';
  b.innerHTML=`<button type="button" class="go">⚔ ${esc(peerName(host))}님과 함께 대군 막기</button>`;b.querySelector('.go').addEventListener('click',e=>{e.stopPropagation();b.remove();WARBTN=false;coopJoin(host);});document.body.appendChild(b);}
function coopJoin(host){if(SIEGE||BATTLE)return;G.siegeDay=G.day;closePanel();COOPD={};
  SIEGE={go:false,wave:0,max:1,next:99,ri:topRegion(),coop:host};G.hp=maxHP();if(G.hunger<40)G.hunger=60;const f=$('#fade');f.classList.add('on');sfx('horn');
  setTimeout(()=>{if(BATTLE)endBattle(true);TOWERA.x=ARENA.x;TOWERA.z=ARENA.z;TOWERA.r=ARENA.r;ARENA.x=SIEGEC.x;ARENA.z=SIEGEC.z;ARENA.r=WARH*1.5;buildSiegeGround();
    ARENA_ON=true;MONS=[];SHOTS=[];TELE=[];P.x=SIEGEC.x+(Math.random()*6-3);P.z=SIEGEC.z+WARH*0.6;P.kx=P.kz=0;P.face=0;CAM.yaw=0;teleArmy();reviveAll(1);f.classList.remove('on');
    bigToast(`👥 ${esc(peerName(host))}님과 함께 대군을 막아요!<small>몬스터 3마리 · 서로 쓰러지면 E로 살려 줘요</small>`);updateBanner();},700);}
/* 친구(손님) 쪽: 방장의 몬스터를 거울처럼 보여 주고, 가까이 오면 나도 맞아요 */
function coopGuestTick(dt){const S=SIEGE,pr=NET.peers.get(S.coop),w=pr&&pr.p&&pr.p.war;
  if(!w||!w.h){siegeOver(false,false);smallToast('방장이 대군 싸움을 떠났어요 — 잃은 건 없어요');return;}
  if(w.done){siegeOver(w.done===1);return;}
  S.go=!!w.go;const list=w.m||[],seen={};
  for(const q of list){const id=q[0];seen[id]=1;let m=null;for(let i=0;i<MONS.length;i++)if(MONS[i].rid===id){m=MONS[i];break;}
    if(!m){const okK=typeof q[1]==='string'&&Object.prototype.hasOwnProperty.call(MON,q[1]);const M=okK?MON[q[1]]:MON.slime;m={id:'r'+id,rid:id,remote:1,kind:okK?q[1]:'slime',L:q[7]||1,x:q[2],z:q[3],tx:q[2],tz:q[3],hp:1,max:100,size:M.size||2.2,fly:!!M.fly,boss:!!M.boss,face:0,ph:Math.random()*6,flash:0,slowT:0,burnT:0,kx:0,kz:0,spawn:0,cd:1,atk:1,rank:q[8]};MONS.push(m);}
    m.tx=q[2];m.tz=q[3];m.hp=q[4];m.max=100;m.face=q[5];m.atk=q[6]||1;}
  for(let i=MONS.length-1;i>=0;i--){const m=MONS[i];if(m.remote&&!seen[m.rid]){burst(m.x,m.z,1,[255,230,140],16,5);MONS.splice(i,1);}}
  for(let i=0;i<MONS.length;i++){const m=MONS[i];if(!m.remote)continue;m.x+=(m.tx-m.x)*Math.min(1,dt*8);m.z+=(m.tz-m.z)*Math.min(1,dt*8);m.ph+=dt*4;m.flash=Math.max(0,m.flash-dt);
    if(!S.go)continue;m.cd-=dt;if(m.cd<=0&&Math.hypot(m.x-P.x,m.z-P.z)<1.6+m.size*0.35){m.cd=1.3;hurtPlayer(m.atk,m);}}}
/* 손님이 때린 피해 (진짜 몬스터는 방장 쪽에 있어요) */
function coopHit(m,dmg){COOPD[m.rid]=Math.round((COOPD[m.rid]||0)+dmg);m.flash=0.14;if(TT-COOPHIT>0.12){COOPHIT=TT;floater(m.x,m.z,2.8,'-'+fmt(Math.round(dmg)),'#fff',0.8);}}
/* 방장 쪽: 내 몬스터 상태를 알리고, 친구들이 때린 만큼 진짜 몬스터에 반영해요 */
function coopHostTick(){const S=SIEGE;if(!S||S.coop||!multiOn())return null;
  for(const[pid,pr]of NET.peers){const w=pr&&pr.p&&pr.p.war;if(!w||w.g!==NET.me||!w.d)continue;for(const id in w.d){const key=pid+':'+id,d=w.d[id]-(HSEEN[key]||0);if(d<=0)continue;HSEEN[key]=w.d[id];
    for(let i=0;i<MONS.length;i++){const m=MONS[i];if(m.id==id&&!m.dead){damageMon(m,d,{quiet:1,kb:0.4},0,0);break;}}}}
  return{h:1,go:S.go?1:0,m:MONS.filter(m=>!m.dead&&!m.remote).slice(0,8).map(m=>[m.id,m.kind,+m.x.toFixed(1),+m.z.toFixed(1),Math.max(0,Math.round(100*m.hp/m.max)),+m.face.toFixed(2),Math.round(m.atk),m.L,m.rank==null?-1:m.rank])};}
let COOPEND=null;function coopEnd(S,win){if(S.coop){COOPD={};return;}if(multiOn()){COOPEND={h:1,done:win?1:2};setTimeout(()=>{COOPEND=null;},6000);}HSEEN={};}
function coopPresence(){if(SIEGE&&SIEGE.coop)return{g:SIEGE.coop,d:COOPD};if(SIEGE)return coopHostTick();return COOPEND;}

/* ---------- 땅 물들이기: 땅을 차지하면 가운데서부터 초록이 번지고 꽃잎이 퐁퐁 ---------- */
const BLOOMSPD=0.75;/* 0.75배속: 천천히 번져요 */
function landBloom(k){const x=zcx(k),z=zcz(k),T=1/BLOOMSPD;
  for(let q=0;q<4;q++)FXS.push({k:'ring',x,z,t:-q*0.28*T,max:1.2*T,r:8+q*5});
  burst(x,z,0.3,[120,220,110],10,3);
  /* 가운데서 바깥으로 풀·꽃이 차례로 피어나요 */
  const cols=[[120,220,110],[90,200,100],[255,170,210],[255,230,120],[200,170,255]];
  for(let ring=1;ring<=4;ring++)setTimeout(()=>{const r=ring*2.3,n=4+ring*3;for(let q=0;q<n;q++){const a=q/n*6.283+ring;burst(x+Math.cos(a)*r,z+Math.sin(a)*r,0.2,cols[(q+ring)%cols.length],2,1.2);}if(ring===4)sfx('pop');},ring*170*T);}

    setTimeout(()=>{bigToast(`🎉 ${R.name} 정복!<small>${R.name}의 깃발이 👑 성에 걸렸어요 · 이 나라 재료는 이제 다른 나라 몬스터가 가져다줘요</small>`);sfx('fanfare');for(let q=0;q<5;q++)setTimeout(()=>{const a=Math.random()*6.28;burst(P.x+Math.cos(a)*4,P.z+Math.sin(a)*4,3+Math.random()*2,[[255,90,120],[255,210,60],[120,200,255],[150,240,140]][q%4],18,7);sfx('pop');},q*260);},2600);
    medalCheck();}}

/* ---------- 🏅 메달 ---------- */
