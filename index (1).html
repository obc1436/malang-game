function ultOneView(){const k=ULTK,W=weaponOf(k),tot=Math.floor(G.ult||0);
  const SK=ultSkill(k);return head(`💥 ${esc(W.name)}`,`필살기: <b>${SK[0]} ${SK[1]}</b> — ${SK[2]}<br>가진 게이지 <b>${tot}</b> · 이 무기 인챈트 <b>Lv ${ultOf(k)}</b> · 쿨타임 ${Math.round(ultCool(ultOf(k)))}초`)+
  `<div class="ultone"><input id="ultIn" class="nin" type="number" inputmode="numeric" min="0" max="${tot}" placeholder="넣을 숫자 (최대 ${tot})"><button class="sm sec" data-act="ultall">전부 (${tot})</button></div>
  <div id="ulmsg" class="hint">숫자를 쓰고 <b>넣기</b>를 누른 뒤 한 번 더 눌러야 들어가요. ✕는 그냥 닫기예요. 넣은 힘은 이 무기에 <b>평생</b> 붙고, 💥 버튼(U)은 쿨타임마다 계속 쓸 수 있어요.</div>
  <div class="tbtns"><button class="big" data-act="ultone">💥 넣기</button></div>`;}
function ultOnePut(){const el=document.getElementById('ultIn');const v=Math.max(0,Math.floor(+(el&&el.value)||0));if(!v)return true;const tot=Math.floor(G.ult||0);
  if(v>tot){const m=document.getElementById('ulmsg');if(m)m.textContent=`게이지가 모자라요 (가진 게이지 ${tot})`;return false;}
  if(ULTCONF!==ULTK+':'+v){ULTCONF=ULTK+':'+v;const m=document.getElementById('ulmsg');if(m)m.innerHTML=`⚠ <b>${v}</b>만큼 넣으면 되돌릴 수 없어요. 맞으면 <b>넣기</b>를 한 번 더 눌러요.`;return false;}ULTCONF='';if(!G.ultW)G.ultW={};G.ultW[ULTK]=(G.ultW[ULTK]||0)+v;G.ult-=v;ULTS='';ultBtn();sfx('craft');smallToast(`💥 ${weaponOf(ULTK).name}에 ${v} 넣었어요! (필살기 힘 ${G.ultW[ULTK]})`,'sat');save();return true;}
/* 꾹 누르기 감지 (0.5초) — 짧게 누르면 그냥 장착 */
let LPT=null,LPDONE=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-act="wequip"]');if(!b)return;LPDONE=false;clearTimeout(LPT);LPT=setTimeout(()=>{LPDONE=true;ULTK=+b.dataset.k;if(navigator.vibrate)try{navigator.vibrate(25);}catch(_){}openPanel('ultone');},500);});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,()=>clearTimeout(LPT),true));
document.addEventListener('click',e=>{if(LPDONE&&e.target.closest&&e.target.closest('[data-act="wequip"]')){LPDONE=false;e.stopImmediatePropagation();e.preventDefault();}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-act="wequip"]'))e.preventDefault();});

/* =====================================================================
   ⚠ 몬스터 기습: 내 땅을 걷다 보면 가끔 깜짝 사건이 터져요 (져도·놓쳐도 잃는 건 없어요)
   · ⚠ 기습: 🙂중수·😤준고수·😠고수 3마리 — 재료 ×1.5
   · 🌊 몬스터 떼: 3마리씩 3번 몰려와요 — 재료 ×3
   · 🦝 재료 도둑: 빠른 황금 도둑이 도망다녀요, 25초 안에 잡으면 — 재료 ×3
   · 🎁 보물 상자 수호자: 상자를 지키는 3마리 — 재료 ×2.5 + 💥게이지 +10
   · 👑 떠돌이 보스: 이 나라 보스가 어슬렁 — 재료 ×3 + 희귀 옷 기회
   · ⏱ 시간 사냥: 40초 안에 3마리를 다 잡으면 — 재료 ×2.5
   ===================================================================== */
const AMBUSH={
  trio:{w:26,ico:'⚠',n:'몬스터 기습',d:'3마리가 튀어나와요',mul:1.5},
  swarm:{w:18,ico:'🌊',n:'몬스터 떼',d:'3마리씩 3번 몰려와요!',mul:3,total:9},
  thief:{w:18,ico:'🦝',n:'재료 도둑',d:'25초 안에 빠른 도둑을 잡아요!',mul:3,total:1,limit:25},
  chest:{w:14,ico:'🎁',n:'보물 상자 수호자',d:'상자를 지키는 3마리를 물리쳐요',mul:2.5,ult:10},
  boss:{w:12,ico:'👑',n:'떠돌이 보스',d:'이 나라 보스가 나타났어요!',mul:3,total:1},
  timed:{w:12,ico:'⏱',n:'시간 사냥',d:'40초 안에 3마리를 다 잡아요!',mul:2.5,limit:40},
  sweep:{w:0,ico:'🧹',n:'옛 땅 청소',d:'약한 몬스터 떼를 시원하게 쓸어버려요!',mul:2,total:12}};
let AMBT=0,AMBN=80+Math.random()*60;
function pickAmbush(R){const ks=Object.keys(AMBUSH).filter(k=>k!=='boss'||R.boss);let t=0;for(const k of ks)t+=AMBUSH[k].w;let x=Math.random()*t;for(const k of ks){x-=AMBUSH[k].w;if(x<=0)return k;}return'trio';}
function ambushTick(dt){if(!G)return;
  if(BATTLE&&BATTLE.ambush){const B=BATTLE,A=AMBUSH[B.ambush];
    if(B.until&&TT>B.until){endBattle(true);smallToast(`${A.ico} ${B.ambush==='thief'?'도둑이 도망갔어요':'시간이 끝났어요'} — 잃은 건 없어요, 다음엔 꼭!`,'bad');updateBanner();return;}
    if(B.ambush==='thief')for(const m of MONS){if(m.dead||m.spawn>0)continue;const dx=m.x-P.x,dz=m.z-P.z,d=Math.hypot(dx,dz)||1;if(d<9){m.x+=dx/d*m.spd*0.9*dt;m.z+=dz/d*m.spd*0.9*dt;}}
    return;}
  if(BATTLE||ARENA_ON||SIEGE||(typeof fenceTime==='function'&&fenceTime()))return;const k=zoneOf(P.x,P.z);if(k<0||!G.owned[k]||inCamp(P.x,P.z)||k===castleK())return;
  AMBT+=dt;if(AMBT<AMBN)return;AMBT=0;AMBN=80+Math.random()*60;
  const R=REG[REGK[k]];const type=easyTile(k)&&Math.random()<0.55?'sweep':pickAmbush(R),A=AMBUSH[type];
  BATTLE={k,ri:REGK[k],boss:false,camp:false,ambush:type,style:'trio',rush:false,multi:1,wave:0,total:A.total||3,next:1.2,until:A.limit?TT+A.limit+1.2:0};
  if(type==='sweep'){BATTLE.total=999;BATTLE.spawnFn=()=>{if(BATTLE.swept)return;BATTLE.swept=1;sweepSpawn(k);BATTLE.total=MONS.filter(m=>m.sweep&&!m.dead).length;};}
  if(type==='thief')BATTLE.spawnFn=()=>{const L=monLevelFor(k,0)+1;const m=addMon(R.mon,P.x+(Math.random()-.5)*10,P.z+8,L,{tile:k,rank:1,noTrait:1});m.hp=m.max=Math.max(1,Math.round(m.hp*0.6));m.spd*=1.9;m.golden=1;m.thief=1;floater(m.x,m.z,3,'🦝 히히, 재료는 내 거!','#ffd23a',2);};
  if(type==='boss')BATTLE.spawnFn=()=>{const L=monLevelFor(k,0)+3;const m=addMon(R.boss,P.x,P.z+10,L,{tile:k,rank:2});m.hp=m.max=Math.round(m.hp*0.8);};
  if(type==='chest'){const cx=P.x,cz=P.z+6;BATTLE.chest=[cx,cz];burst(cx,cz,0.8,[255,215,80],24,4);}
  CAM.shake=0.9;sfx('horn');
  smallToast(`${A.ico} ${A.n}! ${A.d} — 이기면 재료 ×${A.mul}${A.ult?' + 💥게이지':''}`,'bad');updateBanner();}
function ambushWin(B){const A=AMBUSH[B.ambush]||AMBUSH.trio;const got=bonusMats(B.ri,monLevelFor(B.k,1),A.mul);giveMats(got);if(A.ult)ultGain(A.ult);
  G.stats.ambush=(G.stats.ambush||0)+1;sfx('fanfare');burst(P.x,P.z,1.2,[255,230,120],34,7);
  bigToast(`${A.ico} ${A.n} 성공!<small>${B.ambush==='thief'?'도둑을 잡았어요! ':''}보너스 ×${A.mul} · ${matList(got)}${A.ult?` · 💥 게이지 +${A.ult}`:''}</small>`);}

/* =====================================================================
   👑 몬스터 패턴 늘리기
   · 보스·적장: 체력이 절반 아래로 내려가면 "2단계 변신"! 더 크고 빨라지고, 5~7초마다 기술을 골라 써요
       🪨 바위비 — 내 주변 여기저기 빨간 원 (원 밖으로 피해요)
       👥 부하 부르기 — 작은 몬스터 2마리
       💨 돌진 3연타 — 세 번 연달아 덮쳐요 (구르기로 피해요)
       🌀 충격파 — 자기 둘레 큰 원
   · 😠 고수: 체력이 40% 아래면 가끔 바닥 내려찍기 (자기 둘레 빨간 원)
   ===================================================================== */
function bossPattern(m,dt){if(m.dead||m.spawn>0||m.tower&&!m.boss)return;const big=m.boss||m.gen;
  if(big){if(!m.p2&&m.hp<m.max*0.5){m.p2=1;m.size*=1.15;m.spd*=1.15;m.atk=Math.round(m.atk*1.1);m.flash=0.6;m.pt=1.5;CAM.shake=1;sfx('slam');burst(m.x,m.z,1.5,[255,80,80],30,8);floater(m.x,m.z,m.size+1.5,'👑 2단계 변신!','#ff5a5a',2.6);smallToast(`👑 ${MON[m.kind].name}이(가) 화났어요! 2단계 — 빨간 원을 피해요!`,'bad');}
    if(!m.p2)return;
    if(m.dashN>0){m.dashT-=dt;if(m.dashT<=0){m.dashN--;m.dashT=0.55;const dx=P.x-m.x,dz=P.z-m.z,d=Math.hypot(dx,dz)||1;m.kx+=dx/d*26;m.kz+=dz/d*26;TELE.push({x:P.x,z:P.z,r:2.2,t:0.35,max:0.35,dmg:m.atk*0.9});sfx('lunge');}return;}
    m.pt=(m.pt==null?4:m.pt)-dt;if(m.pt>0)return;m.pt=5+Math.random()*2;
    const pick=['rocks','summon','dash','wave'][Math.floor(Math.random()*4)];
    if(pick==='rocks'){for(let q=0;q<6;q++){const a=Math.random()*6.283,r=q===0?0:2+Math.random()*6;TELE.push({x:P.x+Math.cos(a)*r,z:P.z+Math.sin(a)*r,r:2.1,t:1.2+q*0.12,max:1.2+q*0.12,dmg:m.atk*0.8});}floater(m.x,m.z,m.size+1.2,'🪨 바위비!','#ffb070',2);}
    else if(pick==='summon'){for(let q=0;q<2;q++){const a=Math.random()*6.283;const c=addMon(REG[m.ri!=null?m.ri:REGK[m.tile!=null?m.tile:CK]].mon,m.x+Math.cos(a)*3,m.z+Math.sin(a)*3,Math.max(1,m.L-4),{tile:m.tile,tower:m.tower,siege:m.siege,ri:m.ri,noTrait:1,child:1,spawn:0.4});c.hp=c.max=Math.round(c.max*0.35);c.size*=0.75;}if(BATTLE&&m.tile===BATTLE.k)BATTLE.total+=2;floater(m.x,m.z,m.size+1.2,'👥 나와라 부하들!','#c8a0ff',2);}
    else if(pick==='dash'){m.dashN=3;m.dashT=0.6;floater(m.x,m.z,m.size+1.2,'💨 돌진 3연타!','#ff7a7a',2);}
    else{TELE.push({x:m.x,z:m.z,r:5.5,t:1.1,max:1.1,dmg:m.atk*1.1,m});floater(m.x,m.z,m.size+1.2,'🌀 충격파!','#7ad0ff',2);}
    return;}
  if(m.rank===2&&m.hp<m.max*0.4){m.st2=(m.st2==null?2:m.st2)-dt;if(m.st2<=0){m.st2=6+Math.random()*3;TELE.push({x:m.x,z:m.z,r:3.6,t:1,max:1,dmg:m.atk*1.1,m});floater(m.x,m.z,m.size+1,'😠 내려찍기!','#ff9a5a',1.8);}}}

/* ---------- 짜릿한 순간 연출: 보스 등장 이름표 · 마지막 한 방 슬로모션 ---------- */
function introCard(m){let el=document.getElementById('introc');if(!el){el=document.createElement('div');el.id='introc';document.body.appendChild(el);}
  const M=MON[m.kind];el.innerHTML=`<b>${m.boss?'👑':'⛺'} ${esc(M.name)}</b><small>Lv ${m.L} · ${m.boss?'보스 등장!':'적장 등장!'}</small>`;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800);sfx('horn');}
function finishBlow(m){HITSTOP=Math.max(HITSTOP,0.32);CAM.shake=Math.min(1,CAM.shake+0.7);burst(m.x,m.z,1.4,[255,240,150],36,9);floater(m.x,m.z,m.size+1.8,'💥 마무리!','#ffd23a',3);sfx('crit');}

/* =====================================================================
   🎒 위기 탈출 아이템 (1회용) — 몬스터가 가끔 떨어뜨려요 (보스는 꼭 2개)
   💣 폭탄(1) · 🧪 회복 물약(2) · ⚡ 번개 두루마리(3) · 🛡 무적 방패(4) — 화면 아래 버튼이나 숫자 키
   ===================================================================== */
const ITEMS=[{id:'bomb',ico:'💣',n:'폭탄'},{id:'potion',ico:'🧪',n:'회복 물약'},{id:'thunder',ico:'⚡',n:'번개 두루마리'},{id:'shield',ico:'🛡',n:'무적 방패'}];
function itemDrop(m){if(!G||m.child)return;let n=m.boss||m.gen?2:Math.random()<0.07?1:0;if(!n)return;if(!G.items)G.items={};
  for(let q=0;q<n;q++){const it=ITEMS[Math.floor(Math.random()*ITEMS.length)];G.items[it.id]=Math.min(9,(G.items[it.id]||0)+1);floater(m.x,m.z,m.size+2.2,`${it.ico} ${it.n} 획득!`,'#9fe3ff',2);}itemBar(true);}
function nearMon(r){let best=null,bd=r*r;for(const m of MONS){if(m.dead)continue;const dx=m.x-P.x,dz=m.z-P.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=m;}}return best;}
function useItem(id){if(!G||MODE!=='play'||PANEL||VNQ||G.hp<=0)return;if(!G.items||!(G.items[id]>0)){const it=ITEMS.find(x=>x.id===id);smallToast(`${it.ico} ${it.n}이(가) 없어요 — 몬스터가 가끔 떨어뜨려요`,'bad');return;}
  const W=weaponOf(G.weapon),base=Math.max(W.dmg,12)*atkBonus();
  if(id==='bomb'){const m=nearMon(22);if(!m){smallToast('💣 던질 몬스터가 근처에 없어요','bad');return;}const x=m.x,z=m.z;FXS.push({k:'ring',x,z,t:-0.5,max:0.5,r:9});
    setTimeout(()=>{FXS.push({k:'ring',x,z,t:0,max:0.5,r:10});burst(x,z,1,[255,140,60],36,9);CAM.shake=1;sfx('slam');for(const o of MONS.slice()){if(o.dead)continue;const dx=o.x-x,dz=o.z-z,d=Math.hypot(dx,dz);if(d<4.8)damageMon(o,base*6+o.max*(o.boss||o.gen?0.04:0.08),{mine:1,kb:3,burn:1,crit:1},dx/(d||1),dz/(d||1));}},500);floater(P.x,P.z,3.6,'💣 펑!','#ff9a5a',2);}
  else if(id==='potion'){G.hp=Math.min(maxHP(),G.hp+maxHP()*0.5);reviveAll(0.5);burst(P.x,P.z,1,[140,255,170],26,5);sfx('heal');floater(P.x,P.z,3.6,'🧪 회복! 부하도 일어나요','#7cf0a0',2);}
  else if(id==='thunder'){let hit=0;for(const o of MONS.slice()){if(o.dead)continue;const dx=o.x-P.x,dz=o.z-P.z,d=Math.hypot(dx,dz);if(d<18){hit++;burst(o.x,o.z,3,[255,240,120],14,4);damageMon(o,base*4+o.max*(o.boss||o.gen?0.025:0.05),{mine:1,slow:1,crit:1},0,0);}}CAM.shake=0.9;sfx('crit');floater(P.x,P.z,3.6,hit?`⚡ 번개 ${hit}마리!`:'⚡ 번쩍! (근처에 몬스터 없음)','#ffe14a',2);}
  else if(id==='shield'){P.invul=Math.max(P.invul,5);burst(P.x,P.z,1.4,[150,210,255],24,4);sfx('lvl');floater(P.x,P.z,3.6,'🛡 5초 무적!','#9fd8ff',2);}
  G.items[id]--;itemBar(true);save();}
let ITEMV='';
function itemBar(force){const box=document.getElementById('itembar');if(!box||!G)return;const v=ITEMS.map(it=>(G.items&&G.items[it.id])||0).join(',');if(!force&&v===ITEMV)return;ITEMV=v;
  const any=ITEMS.some(it=>G.items&&G.items[it.id]>0);box.hidden=!any;box.innerHTML=ITEMS.map((it,i)=>{const c=(G.items&&G.items[it.id])||0;return`<button data-act="item" data-i="${it.id}" ${c?'':'disabled'} title="${it.n} (${i+1})">${it.ico}<small>${c}</small></button>`;}).join('');}

/* ================= 🌍 땅 특성: 바람 · 뜨거운 · 안개 · 보물 =================
   날마다 바뀌어요. 이길 때 보상이 늘어나요 (바람·안개 ×1.3, 뜨거운 ×1.5, 보물 ×2) */
const TRAITL={wind:['💨','바람 땅','바람이 화살·돌·마법을 옆으로 밀어요','#9fe0ff',1.3],hot:['🔥','뜨거운 땅','조금씩 뜨거워요 (쓰러지진 않아요)','#ff8a4a',1.5],fog:['🌫','안개 땅','가까운 몬스터만 보여요','#b8b0c8',1.3],gold:['💰','보물 땅','이기면 재료 2배!','#ffd23a',2]};
function landTrait(k){if(!G||k<0||G.owned[k]||k===CK||isBoss(k)||CAMPT[k])return null;const s=Math.sin((k+1)*12.9898+(G.day|0)*78.233)*43758.5453;const v=s-Math.floor(s);
  return v<0.08?'wind':v<0.16?'hot':v<0.24?'fog':v<0.31?'gold':null;}
function traitStart(B){const t=landTrait(B.k);B.lt=t;if(!t)return;fogV(t==='fog');}
let WINDA=0,TRT=0,FOGEL=null;
function fogV(on){if(!FOGEL){FOGEL=document.createElement('div');FOGEL.id='fogv';document.body.appendChild(FOGEL);}FOGEL.classList.toggle('on',!!on);}
function traitTick(dt){const B=BATTLE;const t=B&&B.lt;if(!t){if(FOGEL&&FOGEL.classList.contains('on'))fogV(false);return;}
  TRT-=dt;if(t==='wind'){WINDA+=dt*0.25;const wx=Math.cos(WINDA)*7,wz=Math.sin(WINDA)*7;for(let i=0;i<SHOTS.length;i++){const s=SHOTS[i];s.vx+=wx*dt;s.vz+=wz*dt;}
    if(TRT<=0){TRT=0.6;burst(P.x-wx*1.6+(Math.random()-.5)*14,P.z-wz*1.6+(Math.random()-.5)*14,0.3,[235,250,255],2,3);}}
  else if(t==='hot'){if(TRT<=0){TRT=2.2;const mh=maxHP();if(G.hp>mh*0.25)G.hp-=mh*0.025;burst(P.x+(Math.random()-.5)*12,P.z+(Math.random()-.5)*12,0.2,[255,150,60],3,3);}}}
function traitMul(B){return B&&B.lt?TRAITL[B.lt][4]:1;}
function fogHide(m){return BATTLE&&BATTLE.lt==='fog'&&!m.boss&&((m.x-P.x)*(m.x-P.x)+(m.z-P.z)*(m.z-P.z))>64;}

/* ================= 👪 백성 산책 =================
   정복한 내 땅 곳곳을 백성들이 조금씩 돌아다녀요. 내 주변(카메라 가까이)만 미리 정한 수만큼 재사용해서 그려요 → 백성이 몇백 명이어도 가벼워요 */
const FIELDV=[];
function fieldWant(){if(!G||!G.vil||!G.vil.founded||ARENA_ON)return 0;return Math.min([16,10,4][QL],Math.floor((G.vil.people||0)/25));}
function fieldSpot(v){for(let t=0;t<6;t++){const a=Math.random()*6.283,d=12+Math.random()*40;const x=CAM.tx+Math.cos(a)*d,z=CAM.tz+Math.sin(a)*d;const k=zoneOf(x,z);
    if(k>=0&&G.owned[k]&&k!==CK&&!(BATTLE&&BATTLE.k===k)&&!inCamp(x,z)){v.k=k;v.x=x;v.z=z;v.tx=x;v.tz=z;v.on=1;return;}}v.on=0;}
function updField(dt){const want=fieldWant();
  while(FIELDV.length<want){const v={x:0,z:0,tx:0,tz:0,k:-1,key:'v'+(FIELDV.length%4),ph:Math.random()*6,face:0,wait:Math.random()*2,mv:0,on:0,chk:Math.random()};fieldSpot(v);FIELDV.push(v);}
  if(FIELDV.length>want)FIELDV.length=want;
  for(let i=0;i<FIELDV.length;i++){const v=FIELDV[i];v.chk-=dt;
    if(v.chk<=0){v.chk=1+Math.random();const dx=v.x-CAM.tx,dz=v.z-CAM.tz;if(!v.on||dx*dx+dz*dz>4900||(BATTLE&&BATTLE.k===v.k)){fieldSpot(v);continue;}}
    if(!v.on)continue;
    if(v.wait>0){v.wait-=dt;v.mv=0;if(v.wait<=0){const c=zc(v.k),h=TS/2-1.5;v.tx=c.x+(Math.random()*2-1)*h;v.tz=c.z+(Math.random()*2-1)*h;}continue;}
    const dx=v.tx-v.x,dz=v.tz-v.z,d=Math.hypot(dx,dz);if(d<0.3){v.wait=2+Math.random()*5;v.mv=0;continue;}
    v.mv=1;v.x+=dx/d*1.8*dt;v.z+=dz/d*1.8*dt;v.ph+=dt*1.2;v.face=Math.atan2(-dx,-dz);}}


/* ================= 🌍 끝없는 들판: 새 땅이 옆에 붙어요 =================
   지도는 언제나 지금 크기(21×21). 한 땅을 모두 차지하면 바로 옆에 새 땅이 붙어요 — 몬스터 레벨 +25.
   새 땅마다 왕의 성을 하나씩 더 지을 수 있어요. 🗺 지도 위 '나라 지도'에서 오가요 · 아직 안 붙은 자리는 ❓ */
function wInit(){if(!G)return;if(!Array.isArray(G.worlds)||!G.worlds.length){G.worlds=[{x:0,y:0,lv:0}];G.wi=0;}if(G.wi==null||!G.worlds[G.wi])G.wi=0;}
function curW(){return G&&G.worlds?G.worlds[G.wi||0]:null;}
function wLv(){const w=curW();return w?w.lv:0;}
function packO(o){let s='';for(let i=0;i<o.length;i++)s+=o[i]?'1':'0';return s;}
function unpackO(s){const o=Array(N*N).fill(0);if(s)for(let i=0;i<N*N;i++)if(s.charCodeAt(i)===49)o[i]=1;return o;}
function wName(w){const T=wTheme(w.lv);return w.lv?`${w.lv+1}번째 땅 · ${T.p} 나라`:'첫 땅';}
function wStash(){const w=curW();w.o=packO(G.owned);w.mills=G.mills;w.portals=G.portals;w.gates=G.gates;w.n=owned();}
function wLoad(w){if(w.o)G.owned=unpackO(w.o);else{G.owned=Array(N*N).fill(0);G.owned[CK]=1;}G.mills=w.mills||[];G.portals=w.portals||[];G.gates=w.gates||campGates();G.raid=null;}
function wGo(i){if(!G||i===(G.wi||0)||!G.worlds[i])return;if(BATTLE||SIEGE||ARENA_ON){smallToast('싸우는 중에는 다른 땅으로 못 가요','bad');return;}
  closePanel();const f=$('#fade');f.classList.add('on');sfx('roll');
  setTimeout(()=>{wStash();G.wi=i;wLoad(G.worlds[i]);DONEV=-1;CKC.l=null;MONS=[];SHOTS=[];TELE=[];buildGround();buildFence();VILDECO='';buildVillage();
    const p=zc(CK);P.x=p.x;P.z=p.z+4.5;P.kx=P.kz=0;P.face=0;CURZ=-2;teleArmy();VILLS.length=0;FIELDV.length=0;f.classList.remove('on');updateBanner();save(true);
    const w=curW();worldIntroStory(w);bigToast(`🌍 ${wName(w)}${w.lv?` · 몬스터 Lv +${w.lv*25}`:''}<small>땅 ${owned()}/${N*N}${castleK()<0?' · 이 땅에도 🏯 왕의 성을 지을 수 있어요':''}</small>`);},600);}
/* 다 차지했으면 옆에 새 땅을 붙여요 (오른쪽 → 아래 → 왼쪽 → 위 순서로 빈 자리) */
function wCheck(){if(!G||owned()<N*N)return;const w=curW();if(w.done)return;w.done=1;
  const has=(x,y)=>G.worlds.some(q=>q.x===x&&q.y===y);let spot=null;for(const[dx,dy]of[[1,0],[0,1],[-1,0],[0,-1]])if(!has(w.x+dx,w.y+dy)){spot=[w.x+dx,w.y+dy];break;}
  if(!spot){for(const q of G.worlds){for(const[dx,dy]of[[1,0],[0,1],[-1,0],[0,-1]])if(!has(q.x+dx,q.y+dy)){spot=[q.x+dx,q.y+dy];break;}if(spot)break;}}
  const lv=Math.max(...G.worlds.map(q=>q.lv))+1;G.worlds.push({x:spot[0],y:spot[1],lv});save(true);
  setTimeout(()=>{announce('🌍','새 땅이 붙었어요!',`이 땅을 모두 차지했어요! 바로 옆에 <b>${lv+1}번째 땅</b>이 생겼어요<br><b>${wTheme(lv).p} 나라</b>의 새 몬스터와 새 보스가 기다려요! (레벨 +${lv*25}) · 첫 땅의 반가운 몬스터도 가끔 만나요 · 그 땅에도 🏯 왕의 성을 지을 수 있어요<br>🗺 지도 → <b>나라 지도</b>에서 새 땅을 눌러 가요`,'fence');},2500);}
/* 🗺 지도 위 '나라 지도': 붙은 땅은 칸, 그 둘레 빈 자리는 ❓ */
function worldMapHTML(){wInit();const W=G.worlds;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const q of W){x0=Math.min(x0,q.x-1);x1=Math.max(x1,q.x+1);y0=Math.min(y0,q.y-1);y1=Math.max(y1,q.y+1);}
  const at=(x,y)=>W.findIndex(q=>q.x===x&&q.y===y);let cells='';
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=at(x,y);
    if(i>=0){const q=W[i],cur=i===(G.wi||0),n=cur?owned():(q.n!=null?q.n:(q.o?q.o.split('1').length-1:1)),pct=Math.floor(100*n/(N*N));
      cells+=`<button class="wcell ${cur?'cur':''} ${pct>=100?'full':''}" data-act="wgo" data-i="${i}" ${cur?'disabled':''} title="${wName(q)}"><b>${cur?'📍':pct>=100?'✅':'🌱'}</b><small>${q.lv?wTheme(q.lv).p:"첫 땅"}</small><em>${pct}%</em></button>`;}
    else{const adj=W.some(q=>Math.abs(q.x-x)+Math.abs(q.y-y)===1);cells+=adj?`<div class="wcell q" title="아직 안 붙은 땅">❓</div>`:`<div class="wcell e"></div>`;}}
  return`<div class="wmap"><div class="wmh"><b>🌍 나라 지도</b><small>지금: ${wName(curW())}${wLv()?` · 몬스터 Lv +${wLv()*25}`:''} · 이 땅을 모두 차지하면 옆에 새 땅이 붙어요 (❓)</small></div><div class="wgrid" style="grid-template-columns:repeat(${x1-x0+1},44px)">${cells}</div></div>`;}


/* ================= 👥 데려갈 부하 수 고르기 =================
   싸우러 갈 때 데려갈 부하 수를 골라요. 적게 데려갈수록 몬스터도 약해지지만(부하 수 난이도), 이기면 재료를 더 받아요.
   혼자 ×3 · 3명 이하 ×2.5 · 5명 이하 ×2 · 10명 이하 ×1.5 · 20명 이하 ×1.2 · 전부 ×1 */
const SQOPT=[null,20,10,5,3,0];
function squadBonus(){const s=G.squad;if(s==null||s>=ARMYN)return 1;return s===0?3:s<=3?2.5:s<=5?2:s<=10?1.5:s<=20?1.2:1;}
function squadNext(){if(BATTLE||SIEGE||ARENA_ON){smallToast('싸우는 중에는 바꿀 수 없어요','bad');return;}
  const opts=SQOPT.filter(v=>v==null||v<ARMYN);let i=opts.indexOf(G.squad==null?null:G.squad);G.squad=opts[(i+1)%opts.length];if(G.squad===undefined)G.squad=null;
  buildArmy();teleArmy();SQS='';squadBtn();const b=squadBonus();smallToast(G.squad==null?`👥 부하 전부(${ARMYN}명) 데려가요`:G.squad===0?'👤 혼자 싸워요! 이기면 재료 ×3':`👥 부하 ${G.squad}명만 데려가요 · 이기면 재료 ×${b}`,'sat');save();updateBanner();}
let SQS='';function squadBtn(){const b=el$('#bS');if(!b||!G)return;const s=(G.squad==null?'all':G.squad)+'|'+ARMYN;if(s===SQS)return;SQS=s;b.hidden=ARMYN<1;
  b.firstChild.textContent=G.squad===0?'👤':'👥';b.lastChild.textContent=G.squad==null?'전부':G.squad===0?'혼자':G.squad+'명';b.classList.toggle('on',G.squad!=null);}

/* ================= 📜 오늘의 규칙 — 날마다 싸움 규칙이 하나씩 바뀌어요 ================= */
const RULES=[
  {id:'giant',ico:'🦣',n:'거인의 날',d:'몬스터가 크고 튼튼해요 (체력 ×1.6) · 이기면 재료 ×2'},
  {id:'tiny',ico:'🐣',n:'꼬마 몬스터의 날',d:'몬스터가 작고 빨라요 · 체력 ×0.7'},
  {id:'speed',ico:'⚡',n:'번개 발의 날',d:'나도 몬스터도 1.35배 빨라요!'},
  {id:'gold',ico:'✨',n:'황금비의 날',d:'황금 몬스터가 잔뜩! (재료 ×3)'},
  {id:'ult',ico:'💥',n:'필살기 축제',d:'필살기 쉬는 시간이 절반!'},
  {id:'candy',ico:'🍬',n:'사탕비의 날',d:'몬스터를 쓰러뜨리면 사탕이 떨어져 체력 회복'},
  {id:'crit',ico:'💢',n:'세 번째 한 방',d:'세 번 때릴 때마다 ×3 한 방!'}];
function ruleToday(){return G?RULES[(G.day*5+3)%RULES.length]:null;}
function rule(id){const r=ruleToday();return!!r&&r.id===id;}
let CRITN=0;
function ruleHit(m,dmg){let f=1;if(rule('crit')){CRITN++;if(CRITN>=3){CRITN=0;f=3;floater(m.x,m.z,3.8,'💢 한 방!','#ff5a7a',1.2);}}return f;}
function ruleSpawn(m){if(rule('giant')){m.hp=m.max=Math.round(m.hp*1.6);m.size*=1.4;}else if(rule('tiny')){m.hp=m.max=Math.round(m.hp*0.7);m.size*=0.65;m.spd*=1.3;}
  else if(rule('speed'))m.spd*=1.35;else if(rule('gold')&&m.rank!=null&&!m.boss&&!m.golden&&Math.random()<0.4){m.golden=1;m.hp=m.max=Math.round(m.hp*1.3);}}
function ruleKill(m){if(rule('candy')&&G.hp>0){const h=Math.round(maxHP()*0.06);G.hp=Math.min(maxHP(),G.hp+h);floater(m.x,m.z,2.6,`🍬 +${fmt(h)}`,'#ff8ac8',1.2);}}
function ruleMorning(){const r=ruleToday();if(r)setTimeout(()=>smallToast(`📜 오늘의 규칙: ${r.ico} ${r.n} — ${r.d}`,'sat'),2600);}

/* ================= 🧹 옛 땅 청소 — 쉬운 옛 땅에 가끔 약한 몬스터 떼가 나타나요 → 새 무기로 시원하게 쓸어버리기! ================= */
function easyTile(k){let t=0;for(let q=0;q<N*N;q++)if(G.owned[q])t=Math.max(t,tierOf(q));return tierOf(k)<=Math.max(2,Math.floor(t*0.5));}
function sweepSpawn(k){const R=REG[REGK[k]];const n=10+(Math.random()*5|0);const hp=Math.max(1,Math.round(pDPS()*0.22));
  for(let i=0;i<n;i++){const a=i/n*6.283,d=6+Math.random()*4;const m=addMon(R.mon,P.x+Math.cos(a)*d,P.z+Math.sin(a)*d,Math.max(1,tileMin(k)),{tile:k,noTrait:1,noElite:1,spawn:0.2+i*0.05,sweep:1});
    m.hp=m.max=hp;m.atk=Math.max(1,Math.round(maxHP()*0.01));m.size*=0.85;m.akh=AK.h;m.aka=AK.a;m.weak=null;}
  floater(P.x,P.z,4,`🧹 약한 몬스터 ${n}마리! 싹 쓸어버려요!`,'#7fe0a0',2);}

/* ================= 📋 하루 목표 — 매일 3개 · 숫자는 1~7 (쉽게 깰 수 있게) ================= */
const GOALDEF={claim:['🚩','땅 {n}칸 차지하기'],kill:['⚔','몬스터 {n}마리 쓰러뜨리기'],ult:['🌀','필살기 {n}번 쓰기'],counter:['✨','반격 찬스 {n}번'],eat:['🍲','음식 {n}번 먹기']};
function goalsToday(){if(!G)return null;if(!G.goals||G.goals.day!==G.day||G.goals.list.some(q=>!GOALDEF[q.id])){const ks=Object.keys(GOALDEF);const pick=[];let s=G.day*9301+49297;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280;};
    while(pick.length<3){const k=ks[Math.floor(rnd()*ks.length)];if(!pick.includes(k))pick.push(k);}
    G.goals={day:G.day,list:pick.map(id=>({id,n:1+Math.floor(rnd()*7),p:0,done:0})),all:0};}return G.goals;}
function goalEv(id,c){const g=goalsToday();if(!g)return;for(const q of g.list){if(q.id!==id||q.done)continue;q.p=Math.min(q.n,q.p+(c||1));if(q.p>=q.n){q.done=1;const D=GOALDEF[q.id];const got=bonusMats(topRegion(),Math.max(3,G.lv),1.5);giveMats(got);ultGain(3);
      setTimeout(()=>smallToast(`📋 목표 달성! ${D[0]} ${D[1].replace('{n}',q.n)} · ${matList(got)} · 💥+3`,'sat'),300);sfx('fanfare');}}
  if(!g.all&&g.list.every(q=>q.done)){g.all=1;ultGain(5);G.items=G.items||{};G.items.potion=(G.items.potion||0)+1;itemBar(true);setTimeout(()=>bigToast('🏅 오늘의 목표 모두 완료!<small>💥 게이지 +5 · 🧪 물약 +1</small>'),1500);}}
function goalCard(){const g=goalsToday();if(!g)return;let el=document.getElementById('goalcard');if(!el){el=document.createElement('div');el.id='goalcard';document.body.appendChild(el);el.addEventListener('click',e=>{if(e.target.closest('.gx')||e.target===el)el.classList.remove('on');});}
  const r=ruleToday();el.innerHTML=`<div class="gbox"><button class="gx" aria-label="닫기">✕</button><h2>📋 ${G.day}일째 오늘의 목표</h2>${r?`<p class="grule">📜 오늘의 규칙 <b>${r.ico} ${r.n}</b><br><small>${r.d}</small></p>`:''}
    ${g.list.map(q=>{const D=GOALDEF[q.id];return`<div class="gitem ${q.done?'done':''}"><span class="gi">${D[0]}</span><div><b>${D[1].replace('{n}',q.n)}</b><i><em style="width:${100*q.p/q.n}%"></em></i></div><span class="gp">${q.done?'✅':q.p+'/'+q.n}</span></div>`;}).join('')}
    <p class="gfoot">하나 깰 때마다 재료 + 💥게이지 · 셋 다 깨면 🧪 물약 보너스!</p></div>`;void el.offsetWidth;el.classList.add('on');}

/* ================= 🎲 무작위 재미 =================
   🎁 행운 상자: 땅을 이기면 가끔(30%) 생겨요 → 뒤집힌 카드 3장 중 하나를 골라요 (나머지 카드도 뭐였는지 보여줘요)
   🌠 별똥별: 들판을 걷다 보면 가끔 내 근처에 떨어져요 → 40초 안에 가서 주우면 무작위 선물 */
const LUCK=[
  {w:30,ico:'📦',n:'재료 꾸러미',go:()=>{const got=bonusMats(topRegion(),Math.max(3,G.lv),2+Math.random()*2);giveMats(got);return matList(got);}},
  {w:18,ico:'🎒',n:'아이템 2개',go:()=>{G.items=G.items||{};const a=[];for(let i=0;i<2;i++){const it=ITEMS[Math.random()*ITEMS.length|0];G.items[it.id]=(G.items[it.id]||0)+1;a.push(it.ico+' '+it.n);}itemBar(true);return a.join(' · ');}},
  {w:18,ico:'💥',n:'필살기 게이지',go:()=>{const n=5+(Math.random()*11|0);ultGain(n);return`게이지 +${n}`;}},
  {w:14,ico:'⚒',n:'다음 무기 재료',go:()=>{const L=strongerList();const k=L[0];if(!k){const got=bonusMats(topRegion(),Math.max(3,G.lv),3);giveMats(got);return matList(got);}const mat=weaponOf(k).main,n=Math.ceil(wPrice(weaponOf(k).dmg)*0.25);G.mats[mat]=(G.mats[mat]||0)+n;updRes([mat]);return`${matName(mat)} +${n} (다음 무기 재료!)`;}},
  {w:10,ico:'🍬',n:'사탕 잔치',go:()=>{G.hp=maxHP();G.hunger=100;G.stam=100;return'체력·배고픔·기운 가득!';}},
  {w:7,ico:'👪',n:'새 백성',go:()=>{if(!G.vil.founded){ultGain(8);return'게이지 +8';}const n=3+(Math.random()*6|0);G.vil.people=Math.min(PEOPLE_MAX,G.vil.people+n);return`백성 +${n}명`;}},
  {w:3,ico:'👗',n:'희귀 옷',go:()=>{wardInit();const left=WARD.out.filter(x=>x.drop&&!G.ward.own['out:'+x.id]);if(!left.length){ultGain(15);return'(옷은 다 모았어요) 게이지 +15';}const it=left[Math.random()*left.length|0];G.ward.own['out:'+it.id]=1;return`「${it.n.replace('🎁 ','')}」 — 👗 옷장에서 입어요`;}}];
function luckRoll(){let t=0;for(const r of LUCK)t+=r.w;let x=Math.random()*t;for(const r of LUCK){x-=r.w;if(x<=0)return r;}return LUCK[0];}
function luckGive(){G.luck=(G.luck||0)+1;luckBtn();setTimeout(()=>smallToast('🎁 행운 상자가 생겼어요! 위쪽 🎁 버튼으로 열어요','sat'),2200);save();}
let LUCKS=-1;function luckBtn(){let b=document.getElementById('bLuck');const n=G?G.luck||0:0;if(n===LUCKS&&b)return;LUCKS=n;
  if(!b){b=document.createElement('button');b.id='bLuck';b.type='button';b.addEventListener('click',e=>{e.stopPropagation();luckOpen();});document.getElementById('hud').appendChild(b);}
  b.hidden=!n||MODE!=='play';b.innerHTML=`🎁<small>${n}</small>`;}
function luckOpen(){if(!G||!(G.luck>0))return;if(BATTLE||SIEGE){smallToast('싸움이 끝나면 열 수 있어요');return;}

/* ================= 🔒 잠긴 땅 · 🗝 열쇠 땅 =================
   지면 가장 최근에 얻은 내 땅 한 칸이 🔒 잠겨요 (재료도 안 나와요 · 그 땅에선 싸울 수 없어요).
   잠긴 땅 가까이의 🗝 열쇠 땅에서 이기면 열쇠 땅 + 잠긴 땅 둘 다 내 것! · 잠긴 땅은 언제나 한 칸뿐
   열쇠 땅 도전은 딱 한 번: 지거나 후퇴하면 열쇠가 사라지고 잠긴 땅은 보통 몬스터 땅이 돼요 */
let LOCKMSG='';
function logClaim(k){G.claimLog=G.claimLog||[];G.claimLog.push((G.wi||0)*1000+k);if(G.claimLog.length>60)G.claimLog.shift();}
function myLock(){return G&&G.lock&&(G.lock.w||0)===(G.wi||0)?G.lock:null;}
function isLocked(k){const L=myLock();return!!L&&L.k===k;}
function keyK(){const L=myLock();return L?L.key:-1;}
function safeTile(k){return k===CK||k===castleK()||(G.portals||[]).includes(k)||(G.mills||[]).includes(k);}
function lockLand(){LOCKMSG='';if(!G||G.lock||!multiOn())return;/* 혼자일 땐 원래 게임 그대로 (안 잠겨요) */const w=G.wi||0;let R=-1;const log=G.claimLog||[];
  for(let i=log.length-1;i>=0;i--){const v=log[i];if(Math.floor(v/1000)!==w)continue;const k=v%1000;if(G.owned[k]&&!safeTile(k)){R=k;break;}}
  if(R<0){let bt=-1;for(let k=0;k<N*N;k++){if(!G.owned[k]||safeTile(k))continue;const i=k%N,o=G.owned;const edge=(i<N-1&&!o[k+1])||(i>0&&!o[k-1])||(k+N<N*N&&!o[k+N])||(k>=N&&!o[k-N]);if(edge&&tierOf(k)>bt){bt=tierOf(k);R=k;}}}
  if(R<0)return;G.owned[R]=0;
  let K=-1,bd=1e9;const r=zc(R);for(let k=0;k<N*N;k++){if(k===R||!claimable(k)||isBoss(k))continue;const p=zc(k),d=(p.x-r.x)**2+(p.z-r.z)**2;if(d<bd){bd=d;K=k;}}
  if(K<0){G.owned[R]=1;return;}
  G.lock={w,k:R,key:K};buildGround();buildFence();DONEV=-1;LOCKMSG=`🔒 <b>${REG[REGK[R]].name}</b> 땅 한 칸이 잠겼어요! 바로 옆 <b>🗝 열쇠 땅</b>의 몬스터를 물리치면 되찾아요. 기회는 <b>딱 한 번</b>!`;save(true);}
function keyWin(k){const L=myLock();if(!L||L.key!==k)return;G.owned[L.k]=1;G.lock=null;buildGround();buildFence();DONEV=-1;burst(P.x,P.z,1.5,[255,215,80],40,8);
  setTimeout(()=>bigToast('🔓 잠긴 땅이 열렸어요!<small>🗝 열쇠 땅 + 🔒 잠겼던 땅 — 한 번에 두 칸!</small>'),1300);}

/* 🔒🗝 땅 위 3D 표시: 잠긴 땅 = 폭신한 라벤더 안개 + 둥둥 자물쇠 · 열쇠 땅 = 노란 빛기둥 + 빙글빙글 열쇠 (한 번만 만들어서 계속 재사용) */
let LKM=null,KYM=null;
function buildLockKey(){const a=new GB();const body=hx('#b48cff',1),dark=hx('#7a5ac8'),gold=hx('#ffd23a',1),gd=hx('#e0a020');
  /* 자물쇠: 동그란 몸통 + 고리 + 열쇠 구멍 */
  a.box(0,0,0,1.6,1.3,0.7,body);a.box(0,-0.62,0,1.4,0.12,0.6,dark);
  for(let i=0;i<=10;i++){const t=Math.PI*i/10,x=Math.cos(t)*0.55,y=0.65+Math.sin(t)*0.75;a.sph(x,y,0,0.15,1,hx('#d8d0e8',1),6);}
  a.sph(0,0.08,0.36,0.17,1,dark,6);a.box(0,-0.18,0.36,0.12,0.36,0.05,dark);LKM=a.vbo();
  const k=new GB();/* 열쇠: 고리 + 막대 + 이빨 */
  for(let i=0;i<14;i++){const t=i/14*6.283;k.sph(Math.cos(t)*0.45,1.1+Math.sin(t)*0.45,0,0.14,1,gold,6);}
  k.box(0,0.15,0,0.22,1.5,0.18,gold);k.box(0.22,-0.35,0,0.32,0.16,0.16,gd);k.box(0.18,-0.05,0,0.22,0.14,0.16,gd);k.sph(0,1.1,0,0.16,1,hx('#ff9ad8',1),6);KYM=k.vbo();}
const FOGO={soft:1,alpha:0.18,tint:new Float32Array([0.88,0.8,1])},BEAMO={soft:1,alpha:0.28,tint:new Float32Array([1,0.92,0.5])};
function drawLockKeyMesh(){const L=myLock();if(!L||ARENA_ON)return;if(!LKM)buildLockKey();
  const a=zc(L.k),b=zc(L.key),bob=Math.sin(TT*2)*0.25;
  if(Math.hypot(a.x-CAM.tx,a.z-CAM.tz)<160)drawM(LKM,trs(a.x,4.6+bob,a.z,Math.sin(TT*0.8)*0.5,1.3));
  if(Math.hypot(b.x-CAM.tx,b.z-CAM.tz)<220)drawM(KYM,trs(b.x,4.4-bob,b.z,TT*1.6,1.4));}
/* 안개·빛기둥은 반투명 스프라이트 — 정해 둔 자리만 그려서 가벼워요 */
const FOGP=[];for(let i=0;i<14;i++)FOGP.push([Math.random()*2-1,Math.random()*2-1,Math.random()*6.283,0.6+Math.random()*0.6]);
function pushLockKeyFx(){const L=myLock();if(!L||ARENA_ON)return;const a=zc(L.k),b=zc(L.key),h=TS/2-2;
  if(Math.hypot(a.x-CAM.tx,a.z-CAM.tz)<130)for(let i=0;i<FOGP.length;i++){const q=FOGP[i];const t=TT*0.25+q[2];const x=a.x+q[0]*h+Math.sin(t)*1.2,z=a.z+q[1]*h+Math.cos(t*0.8)*1.2,s=7*q[3];pushS(FX.puff,x,0.4+Math.sin(t*1.3)*0.3,z,s,s*0.7,FOGO);}
  if(Math.hypot(b.x-CAM.tx,b.z-CAM.tz)<240){pushS(FX.puff,b.x,0,b.z,3.2,30,BEAMO);pushS(FX.puff,b.x,0,b.z,1.6,34,BEAMO);}}

/* 🗝 열쇠 땅에서 지거나 후퇴 → 기회 끝 (잠긴 땅은 보통 몬스터 땅으로) · 열쇠 땅 싸움이었으면 true */
function keyFail(retreat){const L=myLock();if(!L||!BATTLE&&!retreat)return false;if(!retreat&&BATTLE&&BATTLE.k!==L.key)return false;
  G.lock=null;buildGround();buildFence();DONEV=-1;LOCKMSG=`🗝 열쇠를 놓쳤어요… 잠겼던 땅은 이제 <b>보통 몬스터 땅</b>이 됐어요. 다시 싸워서 차지하면 돼요!`;
  if(retreat){bigToast('🗝 열쇠가 사라졌어요<small>열쇠 땅에서 후퇴해서 기회가 끝났어요 · 잠겼던 땅은 보통 몬스터 땅이 됐어요</small>');}save(true);return true;}

/* 👥 함께 접속한 사람 수: 나 + 같은 방에 있는 친구 — 2명 이상일 때만 🔒 잠긴 땅 규칙을 써요 */
function playersOn(){let n=1;for(const[,pr]of NET.peers)if(pr&&pr.p)n++;return n;}
function multiOn(){return playersOn()>=2;}
/* 혼자가 된 지 5초가 지나면 잠긴 땅은 원래대로 돌아와요 (혼자일 땐 원래 게임) */

  G.lock=null;smallToast('🔓 혼자 하는 중이라 잠긴 땅이 원래대로 돌아왔어요','sat');save();}


/* ================= 🌍 새 땅의 새 몬스터 · 새 보스 =================
   새 땅마다 테마가 있어서 몬스터와 보스가 새 색깔·새 이름으로 바뀌어요 (같은 모양을 새로 칠해서 가벼워요).
   중수 자리에는 가끔(절반) 첫 땅의 반가운 몬스터(말랑 슬라임·버섯 꼬마·늪개구리·돌멩이 골렘)가 섞여 나와요 */
const WTHEME=[null,{p:'달빛',c:'#9fb8ff'},{p:'불꽃',c:'#ff9a6a'},{p:'얼음꽃',c:'#bff0ff'},{p:'벚꽃',c:'#ffb0d8'},{p:'번개',c:'#ffe66a'},{p:'숲속',c:'#8fe08f'},{p:'별빛',c:'#d8b0ff'}];

const NATCOL={slime:['#7fd0ff','#ff9ac0','#9de07a','#ffd23a','#c58bff','#ff9a6a'],shroom:['#d9534f','#b5763a','#9a6ad0','#5fa8e0','#e0a040'],
  frog:['#5fae4a','#3a9a8a','#e0c040','#6a8ad0','#e0884a'],golem:['#8a8f98','#a08868','#6a6f78','#c8b48a','#7a8a6a'],snowman:['#ffffff','#d8f0ff','#eef4ff'],
  bat:['#5a4a8a','#6a5040','#3a3a5a','#4a6aa0','#8a4a6a'],treant:['#6a8a4a','#8a6a3a','#c87a3a','#e8a0c0','#4a7a5a'],turtle:['#4a8a5a','#8a6a40','#3a6a6a','#a07040'],
  ghost:['#e8eaff','#bfe0ff','#d8c0ff','#ffd8ec','#c8fff0'],cloudbat:['#e8f4ff','#bfe0ff','#ffd8ec','#fff4c0'],candyslime:['#ff9ad8','#9ad8ff','#ffe066','#b0f0a0','#d0a8ff'],
  coralfrog:['#ff8a7a','#5fe0c0','#ffb060','#7ab0ff'],dragon:['#d9534f','#4a9a5a','#4a7ad0','#8a5ac0','#e0a030']};
function hueOf(c){const n=parseInt(c.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return-1;let h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;return(h*60+360)%360;}
function natTint(kind,want){const B=MON[kind];const key=NATCOL[kind]?kind:NATCOL[B.base]?B.base:NATCOL[B.art]?B.art:null;const L=key?NATCOL[key]:null;if(!L)return null;
  const hw=hueOf(want);let best=L[0],bd=1e9;for(const c of L){const h=hueOf(c);const d=h<0||hw<0?90:Math.min(Math.abs(h-hw),360-Math.abs(h-hw));if(d<bd){bd=d;best=c;}}return best;}
function wKind(kind){const lv=wLv();if(!lv||!MON[kind])return kind;const id=kind+'_w'+lv;if(MON[id])return id;const T=wTheme(lv),B=MON[kind];
  const tint=natTint(kind,T.c);MON[id]=Object.assign({},B,{name:`${T.p} ${B.name}`,art:B.art||kind,base:B.base||kind},tint?{tint,tintA:0.65}:{});return id;}
function wPick(kind,extra){if(!wLv()||(extra&&extra.familiar))return kind;if(extra&&extra.rank===0&&!(MON[kind]&&MON[kind].boss)&&Math.random()<0.5)return FAMILIAR[Math.random()*FAMILIAR.length|0];return wKind(kind);}

function hasCrewLine(who){return!!(G.crew&&G.crew[who]&&G.crew[who].found);}
function worldBossStory(){const w=curW();if(!w||!w.lv||w.shard)return;w.shard=1;G.shards=(G.shards||0)+1;const n=G.shards,name=DREAM.shard[(w.lv-1)%7];
  const q=[['narr',`보스가 쓰러지자 품에서 ${name}빛 꿈 조각이 반짝이며 떠올랐다. (꿈 조각 ${Math.min(n,7)}/7)`]];
  if(n===7)for(const l of DREAM.wake)q.push(l);else if(n<7)q.push(['narr',`하늘 위 몽글이가 조금 편안하게 뒤척였다. 남은 조각 ${7-n}개.`]);

/* ================= 📖 도감 보상: 한 종류를 5마리(보스 3마리) 잡을 때마다 =================
   n번째 보상일수록 커져요: 재료 ×(0.5+0.5n) · 필살기 게이지 +n · 50마리마다(보스 15마리마다) 아이템 2개 + 행운 상자 */
/* 보통 몬스터는 5마리마다, 👑 보스는 한 번에 한 마리뿐이라 3마리마다 */
function dexUnit(k){return MON[k]&&MON[k].boss?3:5;}
function dexReward(k){const n=(G.dex&&G.dex[k])||0;G.dexR=G.dexR||{};const cl=G.dexR[k]||0,U=dexUnit(k);if(Math.floor(n/U)<=cl)return;const t=cl+1;G.dexR[k]=t;
  const got=bonusMats(topRegion(),Math.max(3,G.lv),0.5+0.5*t);giveMats(got);ultGain(t);let extra='';
  if((t*U)%(U===3?15:50)===0){G.items=G.items||{};for(let i=0;i<2;i++){const it=ITEMS[Math.random()*ITEMS.length|0];G.items[it.id]=(G.items[it.id]||0)+1;}itemBar(true);G.luck=(G.luck||0)+1;extra=' · 🎒 아이템 2개 · 🎁 행운 상자';}
  sfx('fanfare');bigToast(`📖 ${MON[k]?MON[k].name:'몬스터'} ${t*U}마리 보상!<small>${matList(got)} · 💥 게이지 +${t}${extra}</small>`);save();renderPanel();}
function dexTierToast(k){const n=G.dex[k];if(n%dexUnit(k)===0)setTimeout(()=>smallToast(`📖 ${MON[k]?MON[k].name:''} ${n}마리! 🎒 가방 → 📖 도감에서 보상을 받아요`,'sat'),1200);}

function b64enc(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}

async function streamBytes(u8,T){const r=new Response(new Blob([u8]).stream().pipeThrough(T));return new Uint8Array(await r.arrayBuffer());}

async function readSaveCode(t){t=(t||'').replace(/\s+/g,'');const m=/^MALANG([01]):(.+)$/.exec(t);if(!m)throw 0;let u=b64dec(m[2]);
  if(m[1]==='1'){if(typeof DecompressionStream!=='function')throw 1;u=await streamBytes(u,new DecompressionStream('gzip'));}

a-act=\"mgquit\" aria-label=\"그만하기\">✕<\/button><\/div><div class=\"mwrap\"><canvas id=\"mgc\" width=\"960\" height=\"600\"><\/canvas><div id=\"mgOver\" class=\"mgover\"><\/div><\/div><div id=\"mgPad\" hidden><button id=\"mgShoot\">🧶<small>던지기<\/small><\/button><button id=\"mgSuper\">★<small>필살<\/small><\/button><\/div><\/div><\/div>\n<div id=\"fade\"><\/div>\n<div id=\"nogl\" hidden>이 기기에서는 3D 그래픽(WebGL)을 쓸 수 없어요. 다른 브라우저나 기기에서 열어 주세요.<\/div>\n";
let EMBS=null;
function loadEmbedded(){const c=window.__MALANG_SAVE;if(!c)return;readSaveCode(c).then(s=>{EMBS=s;if(PANEL==='title')renderPanel();}).catch(()=>{});}
function buildGameFile(code){const css=[...document.querySelectorAll('style')].map(e=>e.textContent).find(t=>t.indexOf('--sky:#bfe6ff')>=0)||'';
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+PAGE_HEAD+'<style>'+css+'</style></head><body>'+PAGE_BODY+'<script>window.__MALANG_SAVE='+JSON.stringify(code)+';<\/script><script>'+SELF_JS+'<\/script></body></html>';}
const DL={busy:false,msg:''};
async function downloadGame(){if(DL.busy)return;if(!SELF_JS){DL.msg='여기서는 파일 받기를 할 수 없어요.';renderPanel();return;}DL.busy=true;DL.msg='파일 만드는 중…';renderPanel();
  try{const code=await makeSaveCode();const html=buildGameFile(code);const name='말랑들판원정대.html';
    let dl=null;if(window.claude&&typeof window.claude.use==='function'){try{dl=await window.claude.use('downloads');}catch(e){dl=null;}}
    if(dl){try{const r=await dl.save({filename:name,data:new Blob([html])});DL.msg=r==='saved'||r==='delivered'?'✅ 받았어요! 다운로드 폴더의 말랑들판원정대.html을 열면 지금 진행 그대로 이어져요.':'받기를 취소했어요.';}catch(e){DL.msg=e&&e.code==='declined'?'받기를 취소했어요.':'여기서는 파일 받기가 막혀 있어요. 💾 저장 코드를 써 주세요.';}}
    else if(window.top===window){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();DL.msg='✅ 받았어요! 다운로드 폴더를 확인하세요.';}
    else DL.msg='여기서는 파일 받기가 막혀 있어요. 💾 저장 코드를 써 주세요.';}
  catch(e){DL.msg='파일을 만들지 못했어요.';}DL.busy=false;renderPanel();}
function save(force){if(!G)return;G.savedAt=Date.now();G.px=+P.x.toFixed(1);G.pz=+P.z.toFixed(1);G.inTower=ARENA_ON?1:0;const js=JSON.stringify(G);try{localStorage.setItem(SAVE_KEY,js);}catch(e){}
  if(NET.doc&&(force||Date.now()-CLOUDT>15000)){CLOUDT=Date.now();NET.doc.set({json:js,savedAt:G.savedAt,day:G.day,lv:G.lv}).then(()=>{NET.cloudOk=1;NET.cloud={savedAt:G.savedAt,json:js};}).catch(()=>{NET.cloudOk=0;});}}
function enterPlay(){setTimeout(()=>itemBar(true),0);MODE='play';$('#hud').hidden=false;PANEL=null;$('#panel').hidden=true;ARENA_ON=false;MONS=[];SHOTS=[];TELE=[];PARTS=[];BATTLE=null;CURZ=-2;CAM.yaw=0;P.kx=P.kz=0;P.roll=0;buildGround();updRes(Object.keys(G.mats).filter(k=>G.mats[k]>0).slice(0,6));
  ARMY=[];buildArmy();updateBanner();setAva();VILLS.length=0;VISITT=40;if(AU.ctx)AU.next=AU.ctx.currentTime+0.1;}
function campGates(){const g=[];for(let k=0;k<N*N;k++){if(!G.owned[k])continue;if(!G.owned[k+1]&&(k%N)<N-1)g.push({e:k+'|v',u:0});if(k%N>0&&!G.owned[k-1])g.push({e:(k-1)+'|v',u:0});if(!G.owned[k+N]&&k+N<N*N)g.push({e:k+'|h',u:0});if(k-N>=0&&!G.owned[k-N])g.push({e:(k-N)+'|h',u:0});}return g;}
function startNew(){newGame();wInit();wallInit();siegeCycleStart();G.gates=campGates();const p=zc(CK);P.x=p.x;P.z=p.z+4.5;P.face=0;enterPlay();save(true);vn(STORY.intro,()=>{GPAGE=0;openPanel('guide');});}
function remapGrid(){const L=G.owned.length;if(L===N*N)return;const ON=Math.round(Math.sqrt(L)),off=(N-ON)/2;const m=k=>((k/ON|0)+off)*N+(k%ON)+off;const o=Array(N*N).fill(0);G.owned.forEach((v,k)=>{if(v)o[m(k)]=1;});G.owned=o;
  if(G.mills)G.mills=G.mills.map(m);if(G.portals)G.portals=G.portals.map(m);if(G.gates)G.gates=G.gates.map(g=>{const[k,d]=g.e.split('|');return{e:m(+k)+'|'+d,u:g.u};});if(G.raid)G.raid.k=m(G.raid.k);(G.soldiers||[]).forEach(q=>{if(q.k>=0)q.k=m(q.k);});}
function startLoad(s){G=s;remapGrid();wInit();if(!G.aown){G.aown={0:1};for(let k=1;k<=(G.amax||0);k++)G.aown[k]=1;}for(const k of['foods','flags','stats','mats','wown'])if(!G[k])G[k]={};wallInit();if(G.store){for(const k in G.store)G.mats[k]=(G.mats[k]||0)+G.store[k];delete G.store;}if(!Array.isArray(G.soldiers))G.soldiers=[];for(const h of CREW)if(!G.crew[h])G.crew[h]={found:0,hp:PEOPLE[h].hp,down:0};if(G.dda==null)G.dda=1.15;if(!G.perks)G.perks={};if(!G.perkPending)G.perkPending=0;if(!G.dex)G.dex={};G.soldiers.forEach(q=>{if(q.xp==null)q.xp=q.rec?0:5;});if(!G.vil)G.vil={founded:0,people:0,b:{},lastTax:0};if(!G.treas)G.treas=[];G.treas.forEach(t=>{if(t.e==='coin')t.e='loot';});if(!G.crewxp)G.crewxp={};if(G.raid===undefined)G.raid=null;G.visit=null;if(!Array.isArray(G.mills))G.mills=[];if(!Array.isArray(G.portals))G.portals=[];if(!G.portalPending)G.portalPending=0;if(!Array.isArray(G.gates))G.gates=campGates();wallInit();FSET.clear();G.fw=[];WV++;siegeCycleStart();if(!G.conq)G.conq=doneRegions().slice();if(!G.sets)G.sets=setsDone();if(!G.medals){G.medals={};for(const M of MEDALS)if(M.v()>=M.goal)G.medals[M.id]=G.day;}if(G.vil){migrateVil();fixCastle();}const p=zc(CK);P.x=G.px!=null?G.px:p.x;P.z=G.pz!=null?G.pz:p.z+4.5;if(G.inTower||Math.abs(P.x)>HALF||Math.abs(P.z)>HALF){P.x=p.x;P.z=p.z+4.5;}
  enterPlay();bigToast(`${G.day}일째 · 다시 들판으로!`);}

/* ================= INPUT ================= */
function setupInput(){
  addEventListener('keydown',e=>{audioOn();if(VNQ){if(e.code==='Space'||e.code==='Enter'||e.code==='KeyE'){vnNext();e.preventDefault();}return;}
    if(e.code==='Escape'){if(PANEL==='mini')return;if(PANEL&&MODE==='play'&&PANEL!=='faint')closePanel();else if(MODE==='play'&&!PANEL)openPanel('menu');e.preventDefault();return;}
    if(PANEL){const map={KeyB:'bag',KeyC:'forge',KeyV:'forge',KeyM:'map',KeyP:'village',KeyT:'village'};if(map[e.code]&&PANEL===map[e.code]){closePanel();e.preventDefault();}return;}
    if(MODE!=='play')return;KEYS[e.code]=true;
    switch(e.code){case'Space':ATKHOLD=true;attack();e.preventDefault();break;case'Enter':attack();break;case'KeyK':roll();break;case'KeyE':interact();break;case'KeyF':eat();break;case'KeyY':toggleFPV();break;case'KeyU':ultFire();break;case'Digit1':useItem('bomb');break;case'Digit2':useItem('potion');break;case'Digit3':useItem('thunder');break;case'Digit4':useItem('shield');break;case'KeyQ':swapWeapon();break;
      case'KeyB':openPanel('bag');break;case'KeyC':openPanel('forge');break;case'KeyV':FORGE.tab='armor';openPanel('forge');break;case'KeyM':openPanel('map');break;case'KeyP':VIL.tab='crew';openPanel('village');break;case'KeyT':openPanel('village');break;case'KeyH':netWave();break;case'PageUp':CAM.pitch=clamp(CAM.pitch+0.1,0.12,1.5);break;case'PageDown':CAM.pitch=clamp(CAM.pitch-0.1,0.12,1.5);break;}});
  addEventListener('keyup',e=>{KEYS[e.code]=false;if(e.code==='Space')ATKHOLD=false;});addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=false;ATKHOLD=false;});
  const cv=$('#game');cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{if(MODE!=='play')return;CAM.dist=clamp(CAM.dist+e.deltaY*0.01,9,26);e.preventDefault();},{passive:false});
  let md=null;
  cv.addEventListener('pointerdown',e=>{audioOn();if(VNQ){vnNext();return;}if(MODE!=='play'||PANEL)return;if(e.pointerType==='mouse'&&e.button===2){roll();return;}md={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:0,t:performance.now(),mouse:e.pointerType==='mouse'};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!md||e.pointerId!==md.id)return;const dx=e.clientX-md.lx;md.lx=e.clientX;const dy=e.clientY-md.ly;md.ly=e.clientY;md.moved+=Math.abs(dx)+Math.abs(dy);if(md.moved>6){CAM.yaw-=dx*0.007;CAM.pitch=clamp(CAM.pitch+dy*0.005,0.12,1.5);}});
  const up=e=>{if(!md||e.pointerId!==md.id)return;if(md.moved<8&&performance.now()-md.t<400&&MODE==='play'&&!PANEL)attack();md=null;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>{md=null;});
  $('#vn').addEventListener('click',()=>vnNext());
  const stick=$('#stick'),knob=$('#knob');const joy={id:null,cx:0,cy:0};
  const mj=e=>{let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy;const d=Math.hypot(dx,dy),m=46;if(d>m){dx*=m/d;dy*=m/d;}JOY.x=dx/m;JOY.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;};
  stick.addEventListener('pointerdown',e=>{audioOn();joy.id=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(_){}const r=stick.getBoundingClientRect();joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;mj(e);e.preventDefault();});
  stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)mj(e);});const ej=e=>{if(e.pointerId!==joy.id)return;joy.id=null;JOY.x=JOY.y=0;knob.style.transform='';};stick.addEventListener('pointerup',ej);stick.addEventListener('pointercancel',ej);
  const atk=$('#bA');atk.addEventListener('pointerdown',e=>{e.preventDefault();audioOn();ATKHOLD=true;attack();});['pointerup','pointercancel','pointerleave'].forEach(t=>atk.addEventListener(t,()=>{ATKHOLD=false;}));
  const rot=(id,d)=>{const el=$(id);let iv=null;el.addEventListener('pointerdown',e=>{e.preventDefault();iv=setInterval(()=>{CAM.yaw+=d*0.06;},16);});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{clearInterval(iv);}));};rot('#rotL',1);rot('#rotR',-1);const rotV=(id,d)=>{const el=$(id);let iv=null;el.addEventListener('pointerdown',e=>{e.preventDefault();iv=setInterval(()=>{CAM.pitch=clamp(CAM.pitch+d*0.03,0.12,1.5);},16);});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{clearInterval(iv);}));};rotV('#rotU',1);rotV('#rotD',-1);
  if(TOUCH)document.body.classList.add('touch');}

let LAST=performance.now(),AUTOS=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-LAST)/1000);LAST=now;TT+=dt;
  if(MODE==='play'&&G&&!PANEL&&!VNQ&&G.perkPending>0&&HITSTOP<=0){openPanel('perk');}if(MODE==='play'&&G&&!PANEL&&!VNQ){if(HITSTOP>0)HITSTOP-=dt;else{updPlayer(dt);if(FPV)P.face=CAM.yaw;ultBtn();if(MODE==='play'&&!PANEL){ambushTick(dt);traitTick(dt);starTick(dt);lockSoloTick(dt);updMons(dt);updArmy(dt);siegeTick(dt);}}findInter();AUTOS+=dt;if(AUTOS>15){AUTOS=0;save(false);}}else if(PROMPTL!==null){PROMPTL=null;$('#prompt').hidden=true;$('#bE').classList.remove('ready');}
  updFx(dt);fpsWatch(dt);if(VNQ)vnType(dt);try{render(dt);}catch(e){console.error(e);}updHUD(dt);music();netTick();}
function splash(){const d=document.createElement('div');d.id='yjsplash';d.innerHTML='<div><small>presents</small><b>🎮 예준 스튜디오</b><span>YEJUN STUDIO</span></div>';document.body.appendChild(d);setTimeout(()=>d.classList.add('out'),1700);setTimeout(()=>d.remove(),2400);d.addEventListener('click',()=>d.remove());}
function boot(){try{if(localStorage.getItem('malang_objbig'))document.body.classList.add('objbig');}catch(_){}splash();try{initGL();}catch(e){$('#nogl').hidden=false;return;}genFx();fireFrames();buildGround();setupInput();setupMini();openPanel('title');requestAnimationFrame(frame);netInit();loadEmbedded();}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot,boot);else boot();

})();
